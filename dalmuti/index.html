<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>970KOR 사바나 달무티</title>
  <link rel="stylesheet" href="./dalmuti.css?v=20260516-3" />
</head>
<body>
  <div class="dalmuti-app">
    <header class="dalmuti-topbar">
      <div>
        <div class="eyebrow">970KOR MINI GAME</div>
        <h1>사바나 달무티</h1>
      </div>
      <div class="top-actions">
        <button id="homeBtn" class="btn ghost" type="button">970KOR</button>
        <button id="leaveRoomBtn" class="btn ghost hidden" type="button">방 나가기</button>
      </div>
    </header>

    <main id="lobbyView" class="view show">
      <section class="panel hero-panel">
        <div>
          <h2>조선풍 계급 카드게임</h2>
          <p>같은 계급 카드를 여러 장 내고, 더 높은 계급으로 받아칩니다. 라운드 순위에 따라 다음 계급과 승점이 정해집니다.</p>
        </div>
        <div class="profile-box">
          <span>접속 닉네임</span>
          <strong id="myNickname">-</strong>
        </div>
      </section>

      <section class="lobby-grid">
        <div class="panel">
          <h3>방 만들기</h3>
          <label class="field-label" for="roomTitleInput">방 이름</label>
          <input id="roomTitleInput" class="input" type="text" maxlength="24" placeholder="예: 사바나 한 판" />
          <div class="setting-row">
            <label>라운드</label>
            <select id="totalRoundsSelect" class="input">
              <option value="3">3판</option>
              <option value="5" selected>5판</option>
              <option value="10">10판</option>
              <option value="0">무제한</option>
            </select>
          </div>
          <div class="setting-row">
            <label>턴 제한</label>
            <select id="turnLimitSelect" class="input">
              <option value="15" selected>없음</option>
              <option value="30">없음</option>
            </select>
          </div>
          <button id="createRoomBtn" class="btn primary" type="button">방 만들기</button>
        </div>

        <div class="panel">
          <h3>카드 서열</h3>
          <p class="muted">강함 → 약함</p>
          <div id="rankPreview" class="rank-preview"></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h3>대기방 목록</h3>
          <button id="refreshRoomsBtn" class="btn ghost small" type="button">새로고침</button>
        </div>
        <div id="roomList" class="room-list"></div>
      </section>
    </main>

    <main id="roomView" class="view">
      <section class="room-shell">
        <div class="panel game-panel">
          <div class="room-head">
            <div>
              <div id="roomStateText" class="eyebrow">대기 중</div>
              <h2 id="roomTitle">-</h2>
            </div>
            <div id="turnBadge" class="turn-badge">-</div>
          </div>

          <div id="messageBar" class="message-bar">방 정보를 불러오는 중입니다.</div>

          <div id="lobbyControls" class="lobby-controls hidden">
            <button id="readyBtn" class="btn primary" type="button">준비</button>
            <button id="watchBtn" class="btn ghost" type="button">관전하기</button>
            <button id="joinAsPlayerBtn" class="btn primary hidden" type="button">참가하기</button>
            <button id="startBtn" class="btn ghost" type="button">게임 시작</button>
          </div>

          <div id="betweenControls" class="lobby-controls hidden">
            <button id="nextRoundBtn" class="btn primary" type="button">다음 라운드 시작</button>
            <button id="resetGameBtn" class="btn danger" type="button">새 게임으로 초기화</button>
          </div>

          <div class="table-wrap">
            <div id="playersArea" class="players-area"></div>
            <div id="centerPile" class="center-pile"></div>
          </div>

          <div class="hand-header">
            <div>
              <h3>내 손패</h3>
              <p id="handHelp" class="muted">손패는 계급별 스택으로 표시됩니다.</p>
            </div>
            <div id="selectedSummary" class="selected-summary">선택 없음</div>
          </div>

          <div id="handArea" class="hand-area"></div>

          <div id="playControls" class="action-row hidden">
            <button id="playBtn" class="btn primary" type="button">선택 카드 내기</button>
            <button id="passBtn" class="btn ghost" type="button">패스</button>
          </div>
        </div>

        <aside class="panel side-panel">
          <section>
            <h3>승점표</h3>
            <div id="scoreList" class="score-list"></div>
          </section>
          <section>
            <div class="section-head">
              <h3>채팅</h3>
              <button id="toggleSpectatorChatBtn" class="btn ghost small" type="button">관전자 채팅</button>
            </div>
            <div id="chatList" class="chat-list"></div>
            <div class="chat-input-row">
              <input id="chatInput" class="input" type="text" maxlength="120" placeholder="메시지 입력" />
              <button id="sendChatBtn" class="btn primary small" type="button">전송</button>
            </div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (function () {
      var loginName = String(localStorage.getItem("partyAppUser") || "").trim();
      if (loginName) return;

      var savedGuestName = String(localStorage.getItem("dalmutiGuestNickname") || "").trim();
      var guestName = window.prompt("닉네임을 입력하세요", savedGuestName || "");
      guestName = String(guestName || "").trim().slice(0, 12);

      if (!guestName) {
        guestName = "손님" + Math.floor(1000 + Math.random() * 9000);
      }

      localStorage.setItem("dalmutiGuestNickname", guestName);
      localStorage.setItem("partyAppUser", guestName);
      localStorage.setItem("dalmutiGuestMode", "true");
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="./js/00-config.js?v=20260516-spectatorfix1"></script>
  <script>
    (function () {
      if (!window.firebase || !firebase.apps.length) return;

      const db = firebase.firestore();
      const roomCol = () => db.collection("events").doc("dalmuti").collection("rooms");
      const cleanMap = obj => Object.fromEntries(Object.entries(obj || {}).filter(([, v]) => v && typeof v === "object"));
      const countMap = obj => Object.values(cleanMap(obj)).length;
      const currentUser = () => String(localStorage.getItem("partyAppUser") || "").trim();
      const currentRoomId = () => String(localStorage.getItem("dalmutiCurrentRoomId") || "").trim();
      const serverNow = () => firebase.firestore.FieldValue.serverTimestamp();

      function roomRef(roomId) {
        return roomCol().doc(roomId);
      }

      function handRef(roomId, uid) {
        return roomRef(roomId).collection("hands").doc(uid);
      }

      function nextAliveUid(players) {
        return Object.values(players)
          .filter(p => p && p.uid && !p.finished && !p.forfeited && !p.removedFromRoom)
          .sort((a, b) => (a.seatOrder ?? 999) - (b.seatOrder ?? 999))[0]?.uid || null;
      }

      function removeFromRoomData(room, uid, options) {
        const players = cleanMap(room.players);
        const spectators = cleanMap(room.spectators);
        const kicked = cleanMap(room.kicked);
        const target = players[uid] || spectators[uid];

        if (!target) return null;

        delete players[uid];
        delete spectators[uid];

        if (options?.kick) {
          kicked[uid] = {
            uid,
            nickname: target.nickname || uid,
            by: options.by || currentUser(),
            at: Date.now()
          };
        }

        let currentTurnUid = room.currentTurnUid || null;
        let currentSet = room.currentSet || null;
        let previousSet = room.previousSet || null;
        let tribute = room.tribute || null;

        if (currentTurnUid === uid) currentTurnUid = nextAliveUid(players);

        if (currentSet?.uid === uid) {
          previousSet = currentSet;
          currentSet = null;
          currentTurnUid = nextAliveUid(players);
        }

        if (tribute?.pairs) {
          const pairs = tribute.pairs.filter(p => p.fromUid !== uid && p.toUid !== uid);
          tribute = pairs.length ? { ...tribute, pairs } : null;
        }

        const finishOrder = (room.finishOrder || []).filter(x => x.uid !== uid);
        const chatPreview = (room.chatPreview || []).slice(-11);

        if (options?.message) {
          chatPreview.push({
            type: "system",
            uid: "system",
            nickname: "",
            text: options.message(target),
            createdAt: Date.now()
          });
        }

        const update = {
          players,
          spectators,
          kicked,
          playerCount: countMap(players),
          spectatorCount: countMap(spectators),
          currentTurnUid,
          currentSet,
          previousSet,
          tribute,
          finishOrder,
          chatPreview,
          updatedAt: serverNow()
        };

        if (room.hostUid === uid) {
          const nextHost = Object.values(players)[0] || Object.values(spectators)[0];
          if (nextHost) {
            update.hostUid = nextHost.uid;
            update.hostNickname = nextHost.nickname || nextHost.uid;
          } else {
            update.closed = true;
            update.status = "closed";
          }
        }

        return { update, target };
      }

      async function hardRemove(uid, options) {
        const roomId = currentRoomId();
        if (!roomId || !uid) return false;

        const ref = roomRef(roomId);
        const snap = await ref.get();
        if (!snap.exists) return false;

        const room = snap.data();
        const result = removeFromRoomData(room, uid, options);
        if (!result) return false;

        const batch = db.batch();
        batch.update(ref, result.update);
        batch.delete(handRef(roomId, uid));
        await batch.commit();
        return true;
      }

      async function hardLeave() {
        const uid = currentUser();
        await hardRemove(uid, {
          message: target => `${target.nickname || uid}님이 방에서 나갔습니다.`
        }).catch(console.error);

        localStorage.removeItem("dalmutiCurrentRoomId");
        location.reload();
      }

      const leaveBtn = document.getElementById("leaveRoomBtn");
      if (leaveBtn) {
        leaveBtn.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
          hardLeave();
        }, true);
      }

      function patchKick() {
        if (!window.Dalmuti || window.Dalmuti.__hardKickPatched) return;

        const oldKick = window.Dalmuti.kick;
        window.Dalmuti.kick = async function (uid) {
          const roomId = currentRoomId();
          const me = currentUser();
          if (!roomId || !uid || uid === me) return;

          const snap = await roomRef(roomId).get();
          if (!snap.exists) return;
          const room = snap.data();

          if (!(room.hostUid === me || me === "병풍")) {
            alert("방장만 강퇴할 수 있습니다.");
            return;
          }

          const target = cleanMap(room.players)[uid] || cleanMap(room.spectators)[uid];
          if (!target) {
            alert("이미 방에 없는 대상입니다.");
            return;
          }

          if (!confirm(`${target.nickname || uid}님을 방에서 내보낼까요?`)) return;

          await hardRemove(uid, {
            kick: true,
            by: me,
            message: targetData => `${targetData.nickname || uid}님이 방장에 의해 강퇴되었습니다.`
          }).catch(console.error);
        };

        window.Dalmuti.__hardKickPatched = true;
        window.Dalmuti.__oldKick = oldKick;
      }

      patchKick();
      setTimeout(patchKick, 0);
    })();
  </script>
</body>
</html>
