<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>비눗방울 슈터</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-page">
    <section class="game-card">
      <header class="game-header">
        <div>
<h1>비눗방울 슈터</h1>
<p>조준해서 쏘고, 같은 색 비눗방울을 크게 만들어 터뜨리기</p>
        </div>

        <button id="restartBtn" class="restart-btn" type="button">새 게임</button>
      </header>

      <div class="score-row">
        <div class="score-box">
          <span>점수</span>
          <strong id="scoreText">0</strong>
        </div>
        <div class="score-box">
          <span>최고점수</span>
          <strong id="bestText">0</strong>
        </div>
        <div class="score-box next-box">
          <span>다음</span>
          <strong id="nextDrink">●</strong>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="420" height="640"></canvas>
      </div>

      <div class="status-row">
        <span id="statusText">←/→ 조준, Space 발사</span>
      </div>

      <section class="ranking-card">
        <div class="ranking-title-row">
          <h2>전체 랭킹</h2>
          <span id="rankingStatusText">랭킹 불러오는 중...</span>
        </div>

        <div class="ranking-table-head">
          <span>순위</span>
          <span>닉네임</span>
          <span>점수</span>
          <span>스테이지</span>
          <span>기록일</span>
        </div>

        <div id="rankingList" class="ranking-list">
          <div class="ranking-empty">랭킹 불러오는 중...</div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="./script.js"></script>
</body>
</html>
