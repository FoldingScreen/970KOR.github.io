<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>섀도우 파이터</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050713;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 65%, #20294b 0%, #07091a 58%, #02030a 100%);
    }

    canvas {
      width: min(100vw, 177.77vh);
      height: min(56.25vw, 100vh);
      max-width: 960px;
      max-height: 540px;
      display: block;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.66);
    }

    .hide {
      display: none !important;
    }

    .box {
      width: min(620px, calc(100vw - 28px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.23);
      border-radius: 24px;
      background: rgba(12, 17, 38, 0.94);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.48);
      text-align: center;
    }

    .title {
      margin-bottom: 10px;
      font-size: 42px;
      font-weight: 950;
      letter-spacing: -1px;
    }

    .sub {
      line-height: 1.68;
      opacity: 0.88;
    }

    button {
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      padding: 13px 22px;
      background: #ffd43b;
      color: #111;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      background: linear-gradient(180deg, #24306a, #121936);
      text-align: left;
      cursor: pointer;
    }

    .card:hover {
      border-color: #ffd43b;
      transform: translateY(-1px);
    }

    .key {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffd43b;
      color: #111;
      font-weight: 950;
    }

    .name {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 950;
    }

    .desc {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.45;
      opacity: 0.84;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="startScreen" class="screen">
      <div class="box">
        <div class="title">섀도우 파이터</div>
        <div class="sub">
          그림자괴물들이 너를 향해 몰려온다.<br>
          방향키 이동, <b>A 손 공격</b>, <b>B 발 공격</b>, Space 대쉬, D 패링.<br>
          적은 더 크고 빠르며, 공격 중 빈틈이 생긴다. 스테이지를 클리어할 때마다 보상을 선택하라.
        </div>
        <button id="startBtn">게임 시작</button>
      </div>
    </div>

    <div id="choiceScreen" class="screen hide">
      <div class="box">
        <div class="title" style="font-size:30px">불꽃 수련 선택</div>
        <div id="choiceCards"></div>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hide">
      <div class="box">
        <div class="title">쓰러졌다</div>
        <div id="resultText" class="sub"></div>
        <button id="restartBtn">다시하기</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const startScreen = document.getElementById("startScreen");
      const choiceScreen = document.getElementById("choiceScreen");
      const gameOverScreen = document.getElementById("gameOverScreen");
      const choiceCards = document.getElementById("choiceCards");
      const resultText = document.getElementById("resultText");

      const W = 960;
      const H = 540;
      const FLOOR_Y = 435;
      const MIN_Y = 210;
      const TWO_PI = Math.PI * 2;

      let keys = {};
      let game;
      let lastTime = 0;
      let rafId = null;
      let currentChoices = [];

      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function norm(x, y) {
        const d = Math.hypot(x, y) || 1;
        return { x: x / d, y: y / d };
      }

      function resetGame() {
        game = {
          running: true,
          choosing: false,
          dead: false,

          time: 0,
          score: 0,
          level: 1,
          stage: 1,
          stageKills: 0,
          stageGoal: 9,
          stageSpawnCap: 9,
          stageSpawned: 0,
          stageRewardPending: false,
          stageCleared: false,
          xp: 0,
          nextXp: 9,
          combo: 0,
          comboTimer: 0,
          ult: 0,

          spawnTimer: 0,
          orbTimer: rand(20, 30),
          bossTimer: 0,

          hitStop: 0,
          shake: 0,
          flash: 0,
          slowMo: 0,

          limit: 0,
          cutscene: false,
          cutType: "",
          cutTimer: 0,

          enemies: [],
          hits: [],
          effects: [],
          texts: [],
          ghosts: [],
          orbs: [],
          wallMarks: [],
          dangerLines: [],

          player: {
            x: W / 2,
            y: FLOOR_Y - 28,
            vx: 0,
            vy: 0,
            hp: 100,
            maxHp: 100,
            face: 1,
            dir: { x: 1, y: 0 },
            pose: "idle",

            moveSpeed: 285,
            dashSpeed: 780,
            jumpPower: 560,
            gravity: 1650,
            onGround: true,
            dashCooldown: 0,
            dashTimer: 0,
            invuln: 0,

            attackCooldown: 0,
            attackBaseCooldown: 0.42,
            lastA: 9,
            lastDash: 9,
            comboStage: 0,

            maxCombo: 3,
            maxKickCombo: 2,
            damage: 2,
            range: 82,
            width: 30,
            lunge: 92,
            track: 155,

            spinCooldown: 0,
            lastB: 9,
            kickStage: 0,
            parry: 0,
            parryCooldown: 0,
            parryRecovery: 0,
            counterReady: 0,
            counterTarget: null,

            dashReset: false,
            wallBurst: true,
            fireFeet: false,
            blueFlame: false,
            limitExtend: false,
            parryFire: false,
            parryExplosion: false
          }
        };
      }

      function startGame() {
        resetGame();
        startScreen.classList.add("hide");
        choiceScreen.classList.add("hide");
        gameOverScreen.classList.add("hide");
        cancelAnimationFrame(rafId);
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      document.getElementById("startBtn").onclick = startGame;
      document.getElementById("restartBtn").onclick = startGame;

      window.addEventListener("keydown", (event) => {
        keys[event.code] = true;

        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
          event.preventDefault();
        }

        if (!game) return;

        if (game.choosing) {
          if (event.code === "Digit1") pickUpgrade(0);
          if (event.code === "Digit2") pickUpgrade(1);
          if (event.code === "Digit3") pickUpgrade(2);
          return;
        }

        if (game.dead) {
          if (event.code === "KeyR") startGame();
          return;
        }

        if (game.cutscene || event.repeat) return;

        if (event.code === "Space") dash();
        if (event.code === "KeyA") attack();
        if (event.code === "KeyS") kickAttack();
        if (event.code === "KeyD") parry();
        if (event.code === "KeyF") ultimate();
      });

      window.addEventListener("keyup", (event) => {
        keys[event.code] = false;
      });

      const upgrades = [
        {
          name: "파쇄권",
          desc: "A 손 콤보 4타 해금. 막타가 적을 벽으로 날려 폭발시킨다.",
          condition: (p) => p.maxCombo < 4,
          apply: (p) => p.maxCombo = 4
        },
        {
          name: "화염각",
          desc: "S 발 콤보 2타 해금. 발에도 불꽃이 붙고 발차기 연출이 강화된다.",
          condition: (p) => !p.fireFeet,
          apply: (p) => {
            p.maxKickCombo = 3;
            p.fireFeet = true;
          }
        },
        {
          name: "청염 수련",
          desc: "불꽃이 파랗게 진화한다. 이동속도와 공격 후딜이 약간 개선된다.",
          condition: (p) => !p.blueFlame,
          apply: (p) => {
            p.blueFlame = true;
            p.attackBaseCooldown *= 0.94;
            p.moveSpeed *= 1.08;
          }
        },
        {
          name: "무영보",
          desc: "대쉬 속도는 증가하지만 일반 공격 이동은 크게 늘어나지 않는다.",
          condition: () => true,
          apply: (p) => {
            p.dashSpeed *= 1.15;
            p.lunge *= 1.04;
          }
        },
        {
          name: "연쇄돌파",
          desc: "대쉬공격으로 적을 처치하면 대쉬 쿨타임이 초기화된다.",
          condition: (p) => !p.dashReset,
          apply: (p) => p.dashReset = true
        },
        {
          name: "단전 강화",
          desc: "공격력 +1",
          condition: () => true,
          apply: (p) => p.damage += 1
        },
        {
          name: "추격 보법",
          desc: "공격 추격거리와 타격 범위가 증가한다.",
          condition: () => true,
          apply: (p) => {
            p.track *= 1.16;
            p.range *= 1.1;
            p.width *= 1.08;
          }
        },
        {
          name: "불꽃 패링",
          desc: "패링 성공 시 적에게 화염 피해를 주고 반격 시간이 길어진다.",
          condition: (p) => !p.parryFire,
          apply: (p) => p.parryFire = true
        },
        {
          name: "패링 폭발",
          desc: "패링 성공 시 주변 그림자괴물도 밀쳐낸다.",
          condition: (p) => !p.parryExplosion,
          apply: (p) => p.parryExplosion = true
        },
        {
          name: "체력 단련",
          desc: "최대 HP와 현재 HP가 15 증가한다.",
          condition: () => true,
          apply: (p) => {
            p.maxHp += 15;
            p.hp = Math.min(p.maxHp, p.hp + 15);
          }
        },
        {
          name: "폭주 연장",
          desc: "한계돌파 중 처치하면 지속시간이 조금 증가한다.",
          condition: (p) => !p.limitExtend,
          apply: (p) => p.limitExtend = true
        }
      ];

      function showUpgrades() {
        game.choosing = true;
        choiceScreen.classList.remove("hide");

        const pool = upgrades
          .filter((upgrade) => upgrade.condition(game.player))
          .sort(() => Math.random() - 0.5);

        currentChoices = pool.slice(0, 3);
        choiceCards.innerHTML = "";

        currentChoices.forEach((upgrade, index) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span class="key">${index + 1}</span>
            <div class="name">${upgrade.name}</div>
            <div class="desc">${upgrade.desc}</div>
          `;
          card.onclick = () => pickUpgrade(index);
          choiceCards.appendChild(card);
        });
      }

      function pickUpgrade(index) {
        if (!currentChoices[index]) return;
        currentChoices[index].apply(game.player);
        game.choosing = false;
        choiceScreen.classList.add("hide");

        if (game.stageRewardPending) {
          startNextStage();
        }
      }

      function startNextStage() {
        game.stageRewardPending = false;
        game.stageCleared = false;
        game.stage += 1;
        game.level = game.stage;
        game.stageKills = 0;
        game.stageSpawned = 0;
        game.stageSpawnCap = Math.floor(8 + game.stage * 3.2);
        game.stageGoal = game.stageSpawnCap;
        game.xp = 0;
        game.nextXp = game.stageGoal;
        game.spawnTimer = 1.0;
        game.orbTimer = rand(18, 28);
        addText(W / 2, 118, "STAGE " + game.stage, "#ffd84a", 1.15);
      }

      function checkStageClear() {
        if (game.dead || game.choosing || game.stageCleared) return;
        if (game.stageSpawned < game.stageSpawnCap) return;
        if (game.stageKills < game.stageGoal) return;
        if (game.enemies.some((enemy) => !enemy.dead)) return;

        game.stageCleared = true;
        game.stageRewardPending = true;
        addText(W / 2, 104, "STAGE CLEAR", "#ffd84a", 1.1);
        showUpgrades();
      }

      function buff() {
        if (game.limit > 0) {
          return {
            speed: 0.38,
            move: 2.15,
            damage: 2.8,
            range: 1.75,
            track: 2,
            gold: true
          };
        }

        return {
          speed: 1,
          move: 1,
          damage: 1,
          range: 1,
          track: 1,
          gold: false
        };
      }

      function flameColor() {
        if (game.limit > 0) return "#ffd84a";
        return game.player.blueFlame ? "#59d9ff" : "#ff8a2a";
      }

      function inputDir() {
        let x = 0;
        let y = 0;

        if (keys.ArrowLeft) x -= 1;
        if (keys.ArrowRight) x += 1;
        if (keys.ArrowUp) y -= 1;
        if (keys.ArrowDown) y += 1;

        return x || y ? norm(x, y) : null;
      }

      function nearestEnemy(range, dir = null, free = false) {
        const player = game.player;
        let best = null;
        let bestScore = Infinity;

        for (const enemy of game.enemies) {
          if (enemy.dead || enemy.state === "dying") continue;

          const dx = enemy.x - player.x;
          const dy = enemy.y - player.y;
          const d = Math.hypot(dx, dy);

          if (d > range + enemy.r) continue;

          let dot = 1;
          if (dir) {
            dot = (dx / (d || 1)) * dir.x + (dy / (d || 1)) * dir.y;
            if (dot < 0.15 && !free) continue;
          }

          const threat = enemy.state === "windup" || enemy.state === "attack" ? -90 : 0;
          const score = d - dot * 58 + threat;

          if (score < bestScore) {
            bestScore = score;
            best = enemy;
          }
        }

        return best;
      }

      function aim(range, free = false) {
        const player = game.player;
        const b = buff();
        const input = inputDir();
        const target = nearestEnemy(range * b.track, input, free);

        if (target) return norm(target.x - player.x, target.y - player.y);
        if (input) return input;

        const autoTarget = nearestEnemy(range * 1.25 * b.track, null, true);
        if (autoTarget) return norm(autoTarget.x - player.x, autoTarget.y - player.y);

        return { x: player.face, y: 0 };
      }

      function setPose(name, dir) {
        game.player.pose = name;
        if (dir) game.player.dir = dir;
      }

      function dash() {
        const player = game.player;
        const b = buff();

        if (player.dashCooldown > 0 && game.limit <= 0) return;

        const dir = inputDir() || aim(player.track, true);
        player.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : player.face;
        player.dir = dir;
        player.vx = dir.x * player.dashSpeed * b.move;
        player.vy = dir.y * player.dashSpeed * b.move * 0.72;
        player.dashCooldown = 0.58 * b.speed;
        player.dashTimer = 0.16;
        player.lastDash = 0;
        player.invuln = Math.max(player.invuln, 0.18);

        setPose("dash", dir);
        addGhost(0.22);
        addParticles(player.x, player.y, 16, b.gold ? "#ffd84a" : "#9de1ff", 2.4);
      }

      function attack() {
        const player = game.player;
        const b = buff();

        if (player.parryRecovery > 0) return;
        if (player.attackCooldown > 0 && game.limit <= 0) return;

        if (player.counterReady > 0) {
          counterAttack();
          return;
        }

        if (player.dashTimer > 0 || player.lastDash < 0.22 || keys.Space) {
          dashAttack();
          return;
        }

        if (player.lastA > 0.62) {
          player.comboStage = 0;
        }

        player.comboStage = player.comboStage % player.maxCombo + 1;
        player.lastA = 0;

        const stage = player.comboStage;
        let name = "화염정권";
        let pose = "punch";
        let damage = player.damage;
        let range = player.range;
        let width = player.width;
        let move = player.lunge;
        let cooldown = player.attackBaseCooldown;
        let killStyle = "burn";
        let dir = null;

        if (stage === 2) {
          name = "연환권";
          damage += 0.7;
          range *= 1.05;
          move *= 1.08;
          cooldown *= 0.88;
        }

        if (stage === 3) {
          name = "붕권";
          pose = "big";
          damage += 1.7;
          range *= 1.22;
          width *= 1.12;
          move *= 1.08;
          killStyle = "wall";
        }

        if (stage === 4) {
          name = "파쇄권";
          pose = "finish";
          damage += 3.2;
          range *= 1.36;
          width *= 1.3;
          move *= 1.12;
          killStyle = "wall";
        }

        if (stage === 5) {
          name = "멸화피니시";
          pose = "finish";
          damage += 4.5;
          range *= 1.48;
          width *= 1.4;
          move *= 1.14;
          killStyle = "wall";
        }

        strike({
          name,
          pose,
          dir: dir || aim(player.track, false),
          damage,
          range,
          width,
          move,
          cooldown,
          source: "combo",
          stage,
          killStyle,
          color: flameColor()
        });
      }

      function dashAttack() {
        const player = game.player;
        const dir = aim(player.track * 1.85, true);

        strike({
          name: "슬라이드 펀치",
          pose: "dashPunch",
          dir,
          damage: player.damage + 2.6,
          range: player.range * 1.46,
          width: player.width * 1.2,
          move: player.lunge * 1.75,
          cooldown: player.attackBaseCooldown * 1.15,
          source: "dash",
          stage: 0,
          killStyle: "dash",
          color: game.limit > 0 ? "#ffd84a" : "#9de1ff"
        });
      }

      function kickAttack() {
        const player = game.player;
        const b = buff();

        if (player.spinCooldown > 0 && game.limit <= 0) return;
        if (player.parryRecovery > 0) return;

        if (player.lastB > 0.78) {
          player.kickStage = 0;
        }

        player.kickStage = player.kickStage % player.maxKickCombo + 1;
        player.lastB = 0;

        let name = "앞차기";
        let pose = "kick";
        let radius = 0;
        let damage = Math.ceil((player.damage + 1.7) * b.damage);
        let range = player.range * 1.35 * b.range;
        let width = player.width * 1.15 * b.range;
        let move = player.lunge * 0.72;
        let cooldown = 0.66 * b.speed;
        let killStyle = "spin";
        let dir = aim(player.track * 0.95, false);

        player.fireFeet = true;

        if (player.kickStage === 2) {
          name = "화염각";
          damage += 2;
          range *= 1.12;
          width *= 1.15;
          move *= 1.08;
          cooldown = 0.76 * b.speed;
        }

        if (player.kickStage >= 3) {
          name = "회전각";
          pose = "spin";
          radius = 102 * b.range;
          damage += 2.7;
          cooldown = 0.92 * b.speed;
        }

        player.spinCooldown = cooldown;
        player.attackCooldown = cooldown * 0.78;
        setPose(pose, dir);
        addGhost(0.24);
        addText(player.x, player.y - 62, name, flameColor(), 0.45);

        let hit = false;

        if (radius > 0) {
          game.hits.push({
            circle: true,
            x: player.x,
            y: player.y,
            radius,
            timer: 0.22,
            color: flameColor(),
            width: 10
          });

          for (const enemy of game.enemies) {
            if (enemy.dead || enemy.state === "dying") continue;

            if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= radius + enemy.r) {
              const hitDir = norm(enemy.x - player.x, enemy.y - player.y);
              hitEnemy(enemy, damage, hitDir, "spin", 0, killStyle);
              hit = true;
            }
          }
        } else {
          const sx = player.x;
          const sy = player.y - 18;
          const ex = sx + dir.x * range;
          const ey = sy + dir.y * range;
          player.vx = dir.x * move * b.move;
          player.vy = Math.min(player.vy, -40);

          game.hits.push({
            x1: sx,
            y1: sy,
            x2: ex,
            y2: ey,
            width,
            timer: 0.16,
            color: flameColor()
          });

          for (const enemy of game.enemies) {
            if (enemy.dead || enemy.state === "dying") continue;
            const d = pointToSegmentDistance(enemy.x, enemy.y, sx, sy, ex, ey);
            if (d <= enemy.r + width * 0.5) {
              hitEnemy(enemy, damage, dir, "kick", player.kickStage, killStyle);
              hit = true;
            }
          }
        }

        if (hit) {
          game.hitStop = Math.max(game.hitStop, 0.045);
          game.shake = Math.max(game.shake, 8);
        }
      }

      function parry() {
        const player = game.player;

        if (player.parryCooldown > 0 || player.parryRecovery > 0) return;

        player.parry = 0.2;
        player.parryCooldown = 0.52;
        player.parryRecovery = 0.28;
        player.attackCooldown = Math.max(player.attackCooldown, 0.1);
        setPose("parry", inputDir() || player.dir);
        addText(player.x, player.y - 62, "PARRY", "#9de1ff", 0.34);
        addParticles(player.x, player.y - 18, 10, "#9de1ff", 1.4);

        for (const enemy of game.enemies) {
          if (enemy.dead || enemy.state === "dying") continue;
          if (enemy.state !== "windup" && enemy.state !== "attack") continue;

          const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
          if (d <= enemy.attackRange + 64) {
            parryEnemy(enemy);
            break;
          }
        }
      }

      function parryEnemy(enemy) {
        const player = game.player;
        const dir = norm(enemy.x - player.x, enemy.y - player.y);

        enemy.state = "stun";
        enemy.timer = player.parryFire ? 1.35 : 1.05;
        enemy.vx = dir.x * 170;
        enemy.vy = dir.y * 90;
        enemy.flash = 0.18;
        enemy.hasHit = true;

        player.parry = 0;
        player.parryRecovery = 0.06;
        player.counterReady = player.parryFire ? 1.05 : 0.78;
        player.counterTarget = enemy;
        player.ult = clamp(player.ult + 13, 0, 100);
        player.invuln = Math.max(player.invuln, 0.28);

        game.hitStop = 0.07;
        game.shake = Math.max(game.shake, 12);
        game.flash = Math.max(game.flash, 0.08);

        addText(player.x, player.y - 85, "PARRY!", "#9de1ff", 0.68);
        addParticles(enemy.x, enemy.y, 28, "#9de1ff", 3.5);
        addRing(player.x, player.y, 70, "#9de1ff");

        if (player.parryFire) {
          enemy.hp -= Math.ceil(player.damage * 1.4);
          addParticles(enemy.x, enemy.y, 18, flameColor(), 2.8);
          if (enemy.hp <= 0) killEnemy(enemy, "burn", dir, false);
        }

        if (player.parryExplosion) {
          for (const other of game.enemies) {
            if (other === enemy || other.dead || other.state === "dying") continue;
            const d = Math.hypot(other.x - player.x, other.y - player.y);
            if (d < 115) {
              const push = norm(other.x - player.x, other.y - player.y);
              other.vx += push.x * 230;
              other.vy += push.y * 120;
              other.state = "stun";
              other.timer = 0.55;
              other.flash = 0.12;
            }
          }
        }
      }

      function counterAttack() {
        const player = game.player;
        const target = player.counterTarget && !player.counterTarget.dead ? player.counterTarget : nearestEnemy(player.track * 1.5, null, true);
        const dir = target ? norm(target.x - player.x, target.y - player.y) : (inputDir() || player.dir);

        player.counterReady = 0;
        player.counterTarget = null;

        strike({
          name: "반격정권",
          pose: "counter",
          dir,
          damage: player.damage + 5,
          range: player.range * 1.7,
          width: player.width * 1.55,
          move: player.lunge * 1.4,
          cooldown: player.attackBaseCooldown * 1.2,
          source: "counter",
          stage: 5,
          killStyle: "wall",
          color: "#9de1ff"
        });
      }

      function strike(config) {
        const player = game.player;
        const b = buff();
        const dir = norm(config.dir.x, config.dir.y);
        const damage = Math.ceil(config.damage * b.damage);
        const range = config.range * b.range;
        const width = config.width * b.range;

        player.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : player.face;
        player.dir = dir;

        const moveScale =
          config.source === "dash" ? 1.0 :
          config.source === "counter" ? 0.62 :
          config.stage >= 4 ? 0.46 :
          0.34;

        player.vx += dir.x * config.move * b.move * moveScale;

        if (dir.y < -0.35) {
          player.vy = Math.min(player.vy, -150 * b.move);
        } else if (dir.y > 0.45 && !player.onGround) {
          player.vy += 160 * b.move;
        }

        player.attackCooldown = config.cooldown * b.speed;
        setPose(config.pose, dir);
        addGhost(0.24);
        addText(player.x, player.y - 62, config.name, config.color, 0.42);

        const sx = player.x;
        const sy = player.y - 18;
        const ex = sx + dir.x * range;
        const ey = sy + dir.y * range;

        game.hits.push({
          x1: sx,
          y1: sy,
          x2: ex,
          y2: ey,
          width,
          timer: 0.14,
          color: config.color
        });

        let didHit = false;
        let didKill = false;

        for (const enemy of game.enemies) {
          if (enemy.dead || enemy.state === "dying") continue;

          const d = pointToSegmentDistance(enemy.x, enemy.y, sx, sy, ex, ey);
          if (d <= enemy.r + width * 0.5) {
            didHit = true;
            if (hitEnemy(enemy, damage, dir, config.source, config.stage, config.killStyle)) {
              didKill = true;
            }
          }
        }

        if (didHit) {
          game.hitStop = Math.max(game.hitStop, config.source === "dash" || config.source === "counter" ? 0.055 : 0.035);
          game.shake = Math.max(game.shake, config.source === "counter" ? 13 : config.source === "dash" ? 9 : 6);
        }

        if (didKill && config.source === "dash" && player.dashReset) {
          player.dashCooldown = 0;
          addText(player.x, player.y - 88, "연쇄돌파!", "#9de1ff", 0.55);
        }

        if (didKill && game.limit > 0 && player.limitExtend && game.limit < 8) {
          game.limit += 0.15;
        }
      }

      function hitEnemy(enemy, damage, dir, source, stage, killStyle) {
        if (enemy.dead || enemy.state === "dying") return false;

        enemy.hp -= damage;
        enemy.flash = 0.14;
        enemy.state = enemy.state === "stun" ? "stun" : "hurt";
        enemy.timer = 0.15;
        enemy.vx += dir.x * (source === "dash" ? 290 : source === "counter" ? 420 : 190);
        enemy.vy += dir.y * 90;

        addText(enemy.x, enemy.y - enemy.r, "-" + damage, "#fff3a8", 0.42);
        addParticles(enemy.x, enemy.y, 12 + Math.min(16, damage * 2), flameColor(), 2.5);

        if (enemy.hp <= 0) {
          killEnemy(enemy, killStyle, dir, stage >= 4 || source === "dash" || source === "counter");
          return true;
        }

        return false;
      }

      function killEnemy(enemy, style, dir, forceLaunch) {
        if (enemy.dead || enemy.state === "dying") return;

        game.score += enemy.score;
        game.combo += 1;
        game.comboTimer = 1.25;
        game.ult = clamp(game.ult + enemy.ult, 0, 100);
        game.stageKills += 1;
        game.xp = game.stageKills;
        game.nextXp = game.stageGoal;

        addText(enemy.x, enemy.y - enemy.r - 10, "+" + enemy.score, "#ffef8a", 0.6);

        if (style === "wall" || forceLaunch) {
          enemy.state = "dying";
          enemy.killStyle = "wall";
          enemy.deadTimer = 1.5;
          enemy.vx = (dir.x >= 0 ? 1 : -1) * (620 + rand(0, 120));
          enemy.vy = dir.y * 100 - 60;
          enemy.spin = rand(-12, 12);
          addAfterImage(enemy.x, enemy.y, enemy.r, "#18111f");
          return;
        }

        if (style === "spin") {
          enemy.state = "dying";
          enemy.killStyle = "spin";
          enemy.deadTimer = 0.65;
          enemy.vx = dir.x * 340;
          enemy.vy = -180 + dir.y * 80;
          enemy.spin = 18 * (dir.x || 1);
          addParticles(enemy.x, enemy.y, 22, "#ff8a2a", 3.1);
          return;
        }

        if (style === "dash") {
          enemy.state = "dying";
          enemy.killStyle = "dash";
          enemy.deadTimer = 0.55;
          enemy.vx = (dir.x || game.player.face) * 520;
          enemy.vy = dir.y * 120 - 40;
          enemy.spin = 10 * (dir.x || game.player.face);
          addParticles(enemy.x, enemy.y, 18, "#9de1ff", 3.2);
          return;
        }

        burnEnemy(enemy);
      }

      function burnEnemy(enemy) {
        enemy.dead = true;
        addParticles(enemy.x, enemy.y, 28, "#101018", 3.5);
        addParticles(enemy.x, enemy.y, 22, flameColor(), 2.8);
        addRing(enemy.x, enemy.y, enemy.r + 22, flameColor());
        game.shake = Math.max(game.shake, 5);
      }

      function wallSlam(enemy) {
        enemy.dead = true;
        const wallX = enemy.x < W / 2 ? 28 : W - 28;
        enemy.x = wallX;
        game.shake = Math.max(game.shake, 16);
        game.hitStop = Math.max(game.hitStop, 0.075);
        addWallMark(wallX, enemy.y, enemy.r * 1.5);
        addText(wallX, enemy.y - 35, "WALL BREAK!", "#ffdf7e", 0.75);
        addParticles(wallX, enemy.y, 36, "#15111c", 4.8);
        addParticles(wallX, enemy.y, 32, flameColor(), 4.2);
        addRing(wallX, enemy.y, enemy.r + 42, "#ffdf7e");

        for (const other of game.enemies) {
          if (other.dead || other.state === "dying") continue;
          if (Math.hypot(other.x - wallX, other.y - enemy.y) < 95) {
            const push = norm(other.x - wallX, other.y - enemy.y);
            other.hp -= 2 + game.player.damage;
            other.vx += push.x * 260;
            other.vy += push.y * 120;
            other.flash = 0.15;
            if (other.hp <= 0) burnEnemy(other);
          }
        }
      }

      function damagePlayer(amount, enemy, dir) {
        const player = game.player;

        if (player.invuln > 0 || player.dashTimer > 0) return;

        if (player.parry > 0) {
          parryEnemy(enemy);
          return;
        }

        player.hp -= amount;
        player.invuln = 0.7;
        player.vx -= dir.x * 230;
        player.vy -= dir.y * 90;
        player.pose = "hurt";
        game.shake = Math.max(game.shake, 13);
        game.flash = Math.max(game.flash, 0.08);
        addText(player.x, player.y - 74, "-" + amount, "#ff5b5b", 0.65);
        addParticles(player.x, player.y - 20, 18, "#ff5b5b", 2.6);

        if (player.hp <= 0) {
          player.hp = 0;
          game.dead = true;
          game.running = false;
          resultText.innerHTML = `
            점수: <b>${game.score}</b><br>
            생존 시간: <b>${Math.floor(game.time)}초</b><br>
            도달 스테이지: <b>${game.stage}</b><br>
            최고 콤보: <b>${game.combo}</b>
          `;
          gameOverScreen.classList.remove("hide");
        }
      }

      function ultimate() {
        if (game.ult < 100) return;

        game.ult = 0;
        game.flash = 0.35;
        game.shake = 20;
        game.slowMo = 0.35;
        addText(W / 2, 96, "쇼타임!", "#ffd84a", 1);
        addRing(game.player.x, game.player.y, 190, "#ffd84a");

        for (const enemy of game.enemies) {
          if (enemy.dead || enemy.state === "dying") continue;
          const dir = norm(enemy.x - game.player.x, enemy.y - game.player.y);
          enemy.hp -= 18 + game.player.damage * 3;
          if (enemy.hp <= 0) killEnemy(enemy, "wall", dir, true);
          else {
            enemy.vx += dir.x * 440;
            enemy.vy += dir.y * 180;
            enemy.state = "stun";
            enemy.timer = 1.0;
            enemy.flash = 0.25;
          }
        }
      }

      function startLimitBreak() {
        game.cutscene = true;
        game.cutType = "start";
        game.cutTimer = 0;
        game.flash = 0.25;
        game.shake = 14;
        setPose("limit", { x: 0, y: -1 });
        addText(game.player.x, game.player.y - 92, "한계돌파!", "#ffd84a", 1.2);
      }

      function endLimitBreak() {
        game.limit = 0;
        game.cutscene = true;
        game.cutType = "end";
        game.cutTimer = 0;
        game.shake = 8;
        setPose("over", { x: 0, y: 1 });
        game.player.parryRecovery = Math.max(game.player.parryRecovery, 0.22);
        addText(game.player.x, game.player.y - 82, "과부하", "#ddd", 0.75);
      }

      function spawnEnemy(forceType = null) {
        let type = forceType || "grunt";
        const roll = Math.random();

        if (!forceType) {
          const s = game.stage;
          if (s >= 2 && roll < 0.2) type = "runner";
          else if (s >= 3 && roll < 0.36) type = "brute";
          else if (s >= 4 && roll < 0.5) type = "bomber";
          else if (s >= 5 && roll < 0.62) type = "mask";
        }

        const side = Math.random() < 0.5 ? -1 : 1;
        const enemy = {
          x: side < 0 ? -40 : W + 40,
          y: FLOOR_Y - 22,
          vx: 0,
          vy: 0,
          side,
          type,
          state: "move",
          timer: 0,
          attackDir: { x: -side, y: 0 },
          hasHit: false,
          dead: false,
          deadTimer: 0,
          killStyle: "",
          spin: 0,
          rot: 0,
          flash: 0,
          phase: rand(0, 10),
          r: 30,
          hp: 12,
          maxHp: 12,
          speed: 112,
          damage: 10,
          score: 18,
          xp: 0,
          ult: 5,
          attackRange: 68,
          windup: 0.34,
          attackTime: 0.16,
          recovery: 0.34,
          aiThink: rand(0.05, 0.18),
          retreatBias: rand(0.7, 1.25),
          color: "#0c0b13",
          eye: "#ffe066"
        };

        if (type === "runner") {
          enemy.r = 24;
          enemy.y = FLOOR_Y - 23;
          enemy.hp = enemy.maxHp = 9;
          enemy.speed = 190;
          enemy.damage = 8;
          enemy.score = 24;
          enemy.xp = 0;
          enemy.attackRange = 58;
          enemy.windup = 0.2;
          enemy.attackTime = 0.12;
          enemy.recovery = 0.22;
          enemy.eye = "#75ecff";
        }

        if (type === "brute") {
          enemy.r = 44;
          enemy.y = FLOOR_Y - 39;
          enemy.hp = enemy.maxHp = 30;
          enemy.speed = 78;
          enemy.damage = 22;
          enemy.score = 56;
          enemy.xp = 0;
          enemy.ult = 11;
          enemy.attackRange = 92;
          enemy.windup = 0.58;
          enemy.attackTime = 0.22;
          enemy.recovery = 0.5;
          enemy.eye = "#ff6b6b";
        }

        if (type === "bomber") {
          enemy.r = 30;
          enemy.y = FLOOR_Y - 30;
          enemy.hp = enemy.maxHp = 14;
          enemy.speed = 125;
          enemy.damage = 30;
          enemy.score = 38;
          enemy.xp = 0;
          enemy.attackRange = 64;
          enemy.windup = 0.46;
          enemy.attackTime = 0.1;
          enemy.recovery = 0.38;
          enemy.eye = "#ff3232";
        }

        if (type === "mask") {
          enemy.r = 33;
          enemy.y = FLOOR_Y - 32;
          enemy.hp = enemy.maxHp = 18;
          enemy.speed = 140;
          enemy.damage = 14;
          enemy.score = 48;
          enemy.xp = 0;
          enemy.attackRange = 76;
          enemy.windup = 0.27;
          enemy.attackTime = 0.18;
          enemy.recovery = 0.32;
          enemy.eye = "#d6b8ff";
        }

        game.enemies.push(enemy);
      }

      function update(dt) {
        if (!game.running || game.choosing || game.dead) return;

        if (game.hitStop > 0) {
          game.hitStop -= dt;
          return;
        }

        if (game.cutscene) {
          updateCutscene(dt);
          updateVisuals(dt);
          return;
        }

        if (game.slowMo > 0) {
          game.slowMo -= dt;
          dt *= 0.35;
        }

        game.time += dt;
        if (game.flash > 0) game.flash -= dt;
        if (game.shake > 0) game.shake -= 30 * dt;

        updatePlayer(dt);
        updateSpawning(dt);
        updateEnemies(dt);
        updateOrbs(dt);
        updateVisuals(dt);
      }

      function updateCutscene(dt) {
        game.cutTimer += dt;

        if (game.cutType === "start" && game.cutTimer > 1.05) {
          game.cutscene = false;
          game.limit = 5;
          game.flash = 0.35;
          game.shake = 18;
          game.player.attackCooldown = 0;
          game.player.dashCooldown = 0;
          game.player.spinCooldown = 0;
          game.player.parryCooldown = 0;
          addParticles(game.player.x, game.player.y - 18, 64, "#ffd84a", 5.5);
          addRing(game.player.x, game.player.y, 150, "#ffd84a");
        }

        if (game.cutType === "end" && game.cutTimer > 0.5) {
          game.cutscene = false;
        }
      }

      function updatePlayer(dt) {
        const player = game.player;
        const b = buff();

        player.attackCooldown = Math.max(0, player.attackCooldown - dt);
        player.dashCooldown = Math.max(0, player.dashCooldown - dt);
        player.dashTimer = Math.max(0, player.dashTimer - dt);
        player.spinCooldown = Math.max(0, player.spinCooldown - dt);
        player.parry = Math.max(0, player.parry - dt);
        player.parryCooldown = Math.max(0, player.parryCooldown - dt);
        player.parryRecovery = Math.max(0, player.parryRecovery - dt);
        player.counterReady = Math.max(0, player.counterReady - dt);
        player.invuln = Math.max(0, player.invuln - dt);
        player.lastA += dt;
        player.lastB += dt;
        player.lastDash += dt;

        if (player.lastA > 0.62) player.comboStage = 0;

        if (game.comboTimer > 0) {
          game.comboTimer -= dt;
          if (game.comboTimer <= 0) game.combo = 0;
        }

        if (game.limit > 0) {
          game.limit -= dt;
          if (game.limit <= 0) {
            endLimitBreak();
            return;
          }
        }

        const left = keys.ArrowLeft ? 1 : 0;
        const right = keys.ArrowRight ? 1 : 0;
        const moveX = right - left;
        const wantJump = keys.ArrowUp;
        const wantFastFall = keys.ArrowDown;
        const actionPenalty = player.attackCooldown > 0 && game.limit <= 0 ? 0.42 : 1;
        const speed = player.moveSpeed * b.move * actionPenalty;

        if (moveX !== 0) {
          player.face = moveX;
          player.dir = { x: moveX, y: 0 };
        }

        if (wantJump && player.onGround && player.parryRecovery <= 0) {
          player.vy = -player.jumpPower * (game.limit > 0 ? 1.08 : 1);
          player.onGround = false;
          addParticles(player.x, FLOOR_Y - 20, 8, "#d7e3ff", 1.2);
        }

        if (wantFastFall && !player.onGround) {
          player.vy += player.gravity * 0.9 * dt;
        }

        player.x += (moveX * speed + player.vx) * dt;
        player.y += player.vy * dt;
        player.vy += player.gravity * dt;

        player.vx *= Math.pow(0.08, dt);

        player.x = clamp(player.x, 42, W - 42);

        if (player.y >= FLOOR_Y - 18) {
          player.y = FLOOR_Y - 18;
          player.vy = 0;
          player.onGround = true;
        } else {
          player.onGround = false;
        }

        if (player.y < MIN_Y) {
          player.y = MIN_Y;
          if (player.vy < 0) player.vy = 0;
        }

        if ((moveX !== 0 || Math.abs(player.vx) > 230 || game.limit > 0) && player.pose !== "parry") {
          addGhost(0.12);
        }

        if (player.parry > 0) {
          for (const enemy of game.enemies) {
            if (enemy.dead || enemy.state === "dying") continue;
            if (enemy.state !== "windup" && enemy.state !== "attack") continue;
            if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.attackRange + 58) {
              parryEnemy(enemy);
              break;
            }
          }
        }
      }

      function updateSpawning(dt) {
        if (game.stageCleared) return;

        game.spawnTimer -= dt;

        if (game.stageSpawned < game.stageSpawnCap && game.spawnTimer <= 0) {
          spawnEnemy();
          game.stageSpawned += 1;
          const interval = clamp(1.05 - game.stage * 0.08, 0.34, 1.05);
          game.spawnTimer = rand(interval * 0.55, interval * 0.95);
        }

        if (game.stage >= 4 && game.stageSpawned < game.stageSpawnCap - 1) {
          game.bossTimer += dt;
          if (game.bossTimer > Math.max(14, 28 - game.stage * 2)) {
            game.bossTimer = 0;
            spawnEnemy(game.stage % 2 === 0 ? "brute" : "mask");
            game.stageSpawned += 1;
            addText(W / 2, 92, "강한 그림자 접근!", "#ff6b6b", 1);
          }
        }

        game.orbTimer -= dt;
        if (game.stage >= 2 && game.orbTimer <= 0) {
          game.orbTimer = rand(26, 36);
          game.orbs.push({
            x: rand(150, W - 150),
            y: rand(MIN_Y + 25, FLOOR_Y - 55),
            r: 16,
            spin: 0,
            timer: 8,
            dead: false
          });
          addText(W / 2, 122, "금빛 불꽃 출현!", "#ffd84a", 1);
        }

        checkStageClear();
      }

      function updateEnemies(dt) {
        const player = game.player;

        for (const enemy of game.enemies) {
          if (enemy.dead) continue;

          enemy.phase += dt;
          enemy.flash = Math.max(0, enemy.flash - dt);
          enemy.rot += enemy.spin * dt;

          if (enemy.state === "dying") {
            enemy.x += enemy.vx * dt;
            enemy.y += enemy.vy * dt;
            enemy.vy += 1450 * dt;
            enemy.vx *= Math.pow(0.95, dt);
            enemy.deadTimer -= dt;

            if (enemy.killStyle === "wall" && (enemy.x < 32 || enemy.x > W - 32)) {
              wallSlam(enemy);
            } else if (enemy.deadTimer <= 0 || enemy.y > H + 80 || enemy.x < -120 || enemy.x > W + 120) {
              burnEnemy(enemy);
            }

            continue;
          }

          if (enemy.state === "stun" || enemy.state === "hurt") {
            enemy.timer -= dt;
            enemy.x += enemy.vx * dt;
            enemy.y += enemy.vy * dt;
            enemy.vy += 1200 * dt;
            enemy.vx *= Math.pow(0.12, dt);

            if (enemy.y >= FLOOR_Y - enemy.r * 0.35) {
              enemy.y = FLOOR_Y - enemy.r * 0.35;
              if (enemy.vy > 0) enemy.vy = 0;
            }

            if (enemy.timer <= 0) {
              enemy.state = "move";
            }
          } else if (enemy.state === "move") {
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const absDx = Math.abs(dx);
            const dirX = dx < 0 ? -1 : 1;
            const verticalGap = Math.abs(dy);
            const inAttackRange = absDx < enemy.attackRange && verticalGap < 72;

            enemy.attackDir = norm(dx, clamp(dy, -36, 36));
            enemy.side = dirX < 0 ? -1 : 1;

            if (inAttackRange) {
              enemy.state = "windup";
              enemy.timer = enemy.windup;
              enemy.hasHit = false;
              enemy.attackDir = norm(player.x - enemy.x, clamp(player.y - enemy.y, -42, 42));
              game.dangerLines.push({
                x: enemy.x,
                y: enemy.y,
                dx: enemy.attackDir.x,
                dy: enemy.attackDir.y,
                length: enemy.attackRange + 26,
                timer: enemy.windup,
                maxTimer: enemy.windup,
                color: enemy.type === "brute" ? "#ff4d4d" : "#ff8787"
              });
            } else {
              let moveX = dirX;

              const crowdLeft = game.enemies.some((other) =>
                other !== enemy && !other.dead && other.state !== "dying" &&
                Math.abs(other.x - enemy.x) < enemy.r * 1.4 && Math.abs(other.y - enemy.y) < enemy.r
              );

              if (crowdLeft) {
                moveX *= 0.55;
              }

              enemy.x += moveX * enemy.speed * dt;

              if ((enemy.type === "runner" || enemy.type === "mask") && player.y < enemy.y - 46 && Math.random() < 0.012) {
                enemy.vy = -430;
              }
            }

            enemy.y += enemy.vy * dt;
            enemy.vy += 1450 * dt;
          } else if (enemy.state === "windup") {
            enemy.timer -= dt;

            const lockWeight = enemy.timer / enemy.windup;
            const freshDir = norm(player.x - enemy.x, clamp(player.y - enemy.y, -42, 42));
            enemy.attackDir = norm(
              enemy.attackDir.x * 0.82 + freshDir.x * 0.18 * lockWeight,
              enemy.attackDir.y * 0.82 + freshDir.y * 0.18 * lockWeight
            );

            if (enemy.timer <= 0) {
              enemy.state = "attack";
              enemy.timer = enemy.attackTime;
              enemy.hasHit = false;
              enemy.vx += enemy.attackDir.x * (enemy.type === "runner" ? 330 : enemy.type === "brute" ? 190 : 230);
              enemy.vy += enemy.attackDir.y * 115;
            }
          } else if (enemy.state === "attack") {
            enemy.timer -= dt;
            enemy.x += enemy.vx * dt;
            enemy.y += enemy.vy * dt;
            enemy.vy += 900 * dt;
            enemy.vx *= Math.pow(0.35, dt);
            enemy.vy *= Math.pow(0.35, dt);

            const start = { x: enemy.x, y: enemy.y - 4 };
            const end = {
              x: enemy.x + enemy.attackDir.x * (enemy.attackRange + enemy.r * 0.6),
              y: enemy.y + enemy.attackDir.y * (enemy.attackRange + enemy.r * 0.6) - 4
            };

            if (!enemy.hasHit && player.invuln <= 0) {
              const d = pointToSegmentDistance(player.x, player.y - 18, start.x, start.y, end.x, end.y);
              if (d < 27) {
                enemy.hasHit = true;
                damagePlayer(enemy.damage, enemy, enemy.attackDir);
              }
            }

            if (enemy.type === "bomber" && !enemy.hasHit && Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.r + 24) {
              enemy.hasHit = true;
              damagePlayer(enemy.damage, enemy, enemy.attackDir);
              killEnemy(enemy, "burn", enemy.attackDir, false);
            }

            if (enemy.timer <= 0) {
              enemy.state = "recovery";
              enemy.timer = enemy.recovery;
            }
          } else if (enemy.state === "recovery") {
            enemy.timer -= dt;
            enemy.y += enemy.vy * dt;
            enemy.vy += 1200 * dt;

            if (enemy.timer <= 0) {
              enemy.state = "move";
            }
          }

          if (enemy.state !== "dying") {
            if (enemy.y >= FLOOR_Y - enemy.r * 0.35) {
              enemy.y = FLOOR_Y - enemy.r * 0.35;
              if (enemy.vy > 0) enemy.vy = 0;
            }
            enemy.x = clamp(enemy.x, 18, W - 18);
            enemy.y = clamp(enemy.y, MIN_Y - 10, FLOOR_Y + 12);
          }
        }

        game.enemies = game.enemies.filter((enemy) => !enemy.dead);
        checkStageClear();
      }

      function updateOrbs(dt) {
        const player = game.player;

        for (const orb of game.orbs) {
          orb.spin += dt * 5;
          orb.timer -= dt;

          if (Math.hypot(orb.x - player.x, orb.y - player.y) < orb.r + 26) {
            orb.dead = true;
            startLimitBreak();
          }

          if (orb.timer <= 0) {
            orb.dead = true;
          }
        }

        game.orbs = game.orbs.filter((orb) => !orb.dead);
      }

      function updateVisuals(dt) {
        for (const hit of game.hits) hit.timer -= dt;
        game.hits = game.hits.filter((hit) => hit.timer > 0);

        for (const effect of game.effects) {
          effect.x += effect.vx * dt;
          effect.y += effect.vy * dt;
          effect.vy += effect.gravity * dt;
          effect.timer -= dt;
        }
        game.effects = game.effects.filter((effect) => effect.timer > 0);

        for (const text of game.texts) {
          text.y -= 35 * dt;
          text.timer -= dt;
        }
        game.texts = game.texts.filter((text) => text.timer > 0);

        for (const ghost of game.ghosts) ghost.timer -= dt;
        game.ghosts = game.ghosts.filter((ghost) => ghost.timer > 0);

        for (const mark of game.wallMarks) mark.timer -= dt;
        game.wallMarks = game.wallMarks.filter((mark) => mark.timer > 0);

        for (const line of game.dangerLines) line.timer -= dt;
        game.dangerLines = game.dangerLines.filter((line) => line.timer > 0);
      }

      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        if (game && game.shake > 0) {
          ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
        }

        drawBackground();
        drawWallMarks();
        drawDangerLines();

        for (const orb of game.orbs) drawOrb(orb);
        for (const enemy of game.enemies) drawEnemy(enemy);
        for (const hit of game.hits) drawHit(hit);
        for (const effect of game.effects) drawEffect(effect);
        for (const ghost of game.ghosts) drawStickman(ghost.x, ghost.y, ghost.pose, ghost.dir, clamp(ghost.timer / ghost.maxTimer, 0, 1) * 0.28, ghost.gold ? "#ffd84a" : "#9de1ff");

        drawStickman(game.player.x, game.player.y, game.player.pose, game.player.dir, game.player.invuln > 0 ? 0.62 + Math.sin(game.time * 48) * 0.22 : 1, game.limit > 0 ? "#ffd84a" : "#fff");

        for (const text of game.texts) drawText(text);

        drawUI();
        drawModeEffects();

        ctx.restore();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, "#070817");
        gradient.addColorStop(0.58, "#141b37");
        gradient.addColorStop(1, "#24202f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = 0.38;
        ctx.fillStyle = "#fff";
        for (let i = 0; i < 90; i++) {
          ctx.beginPath();
          ctx.arc((i * 113.3) % W, (i * 57.7) % 330, (i % 3) * 0.55 + 0.65, 0, TWO_PI);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#181d32";
        ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

        ctx.fillStyle = "#252f52";
        ctx.fillRect(0, FLOOR_Y, W, 8);

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, FLOOR_Y + 8);
          ctx.lineTo(x - 70, H);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(255, 110, 80, 0.08)";
        ctx.fillRect(0, MIN_Y - 35, 8, FLOOR_Y - MIN_Y + 65);
        ctx.fillRect(W - 8, MIN_Y - 35, 8, FLOOR_Y - MIN_Y + 65);
      }

      function drawWallMarks() {
        for (const mark of game.wallMarks) {
          const alpha = clamp(mark.timer / mark.maxTimer, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(mark.x, mark.y);
          ctx.strokeStyle = mark.color;
          ctx.lineWidth = 3;
          for (let i = 0; i < 7; i++) {
            const a = (TWO_PI * i) / 7 + mark.seed;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * mark.size * rand(0.5, 1), Math.sin(a) * mark.size * rand(0.5, 1));
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawDangerLines() {
        for (const line of game.dangerLines) {
          const alpha = clamp(line.timer / line.maxTimer, 0, 1);
          ctx.save();
          ctx.globalAlpha = 0.2 + 0.55 * alpha;
          ctx.strokeStyle = line.color;
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(line.x, line.y - 3);
          ctx.lineTo(line.x + line.dx * line.length, line.y + line.dy * line.length - 3);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawOrb(orb) {
        ctx.save();
        ctx.translate(orb.x, orb.y);
        ctx.rotate(orb.spin);

        const gradient = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
        gradient.addColorStop(0, "#fff");
        gradient.addColorStop(0.35, "#fff08a");
        gradient.addColorStop(1, "rgba(255,216,74,0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, TWO_PI);
        ctx.fill();

        ctx.fillStyle = "#fff4a8";
        ctx.beginPath();
        ctx.arc(0, 0, orb.r, 0, TWO_PI);
        ctx.fill();

        ctx.restore();
      }

      function drawEnemy(enemy) {
        const stateAlpha = enemy.state === "dying" ? clamp(enemy.deadTimer / 0.6, 0.4, 1) : 1;
        const pulse = Math.sin(enemy.phase * 7) * 0.06;
        const windupScale = enemy.state === "windup" ? 1.18 + Math.sin(enemy.phase * 35) * 0.05 : 1;
        const attackScale = enemy.state === "attack" ? 1.1 : 1;
        const scale = (1 + pulse) * windupScale * attackScale;

        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(enemy.rot);
        ctx.globalAlpha = stateAlpha;

        ctx.fillStyle = enemy.flash > 0 ? "#fff" : enemy.color;
        ctx.strokeStyle = enemy.state === "windup" || enemy.state === "attack" ? "#ff5b5b" : "rgba(255,255,255,0.12)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.ellipse(0, 0, enemy.r * 1.05 * scale, enemy.r * 0.92 * scale, 0, 0, TWO_PI);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath();
        ctx.ellipse(-enemy.r * 0.12, enemy.r * 0.42, enemy.r * 0.85, enemy.r * 0.28, 0, 0, TWO_PI);
        ctx.fill();

        if (enemy.type === "mask") {
          ctx.fillStyle = enemy.flash > 0 ? "#fff" : "#d8d8e8";
          ctx.beginPath();
          ctx.ellipse(0, -enemy.r * 0.1, enemy.r * 0.58, enemy.r * 0.42, 0, 0, TWO_PI);
          ctx.fill();
        }

        if (enemy.type === "bomber") {
          ctx.fillStyle = "#ff3131";
          ctx.beginPath();
          ctx.arc(0, 0, enemy.r * 0.38 + Math.sin(enemy.phase * 12) * 2, 0, TWO_PI);
          ctx.fill();
        }

        const eyeColor = enemy.state === "windup" || enemy.state === "attack" ? "#ff3030" : enemy.eye;
        ctx.fillStyle = eyeColor;
        const eyeY = -enemy.r * 0.23;
        ctx.beginPath();
        ctx.arc(-enemy.r * 0.28, eyeY, enemy.r * 0.12, 0, TWO_PI);
        ctx.arc(enemy.r * 0.28, eyeY, enemy.r * 0.12, 0, TWO_PI);
        ctx.fill();

        if (enemy.state === "attack") {
          ctx.strokeStyle = "#ff5555";
          ctx.lineWidth = 8;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, -4);
          ctx.lineTo(enemy.attackDir.x * (enemy.attackRange + enemy.r * 0.7), enemy.attackDir.y * (enemy.attackRange + enemy.r * 0.7) - 4);
          ctx.stroke();
        }

        if (enemy.state === "stun") {
          ctx.fillStyle = "#9de1ff";
          ctx.font = "900 18px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("✦", 0, -enemy.r - 10);
        }

        ctx.restore();

        if (enemy.maxHp > 4 && !enemy.dead && enemy.state !== "dying") {
          const w = enemy.r * 1.8;
          const ratio = clamp(enemy.hp / enemy.maxHp, 0, 1);
          ctx.fillStyle = "#0008";
          ctx.fillRect(enemy.x - w / 2, enemy.y - enemy.r - 18, w, 5);
          ctx.fillStyle = enemy.type === "brute" ? "#ff6b6b" : "#ffd84a";
          ctx.fillRect(enemy.x - w / 2, enemy.y - enemy.r - 18, w * ratio, 5);
        }
      }

      function drawHit(hit) {
        ctx.save();
        ctx.globalAlpha = clamp(hit.timer / 0.14, 0, 1);

        if (hit.circle) {
          ctx.strokeStyle = hit.color;
          ctx.lineWidth = hit.width || 8;
          ctx.beginPath();
          ctx.arc(hit.x, hit.y, hit.radius, 0, TWO_PI);
          ctx.stroke();
        } else {
          ctx.lineCap = "round";
          ctx.strokeStyle = hit.color;
          ctx.lineWidth = hit.width;
          ctx.beginPath();
          ctx.moveTo(hit.x1, hit.y1);
          ctx.lineTo(hit.x2, hit.y2);
          ctx.stroke();

          ctx.strokeStyle = "#fff";
          ctx.lineWidth = Math.max(2, hit.width * 0.16);
          ctx.beginPath();
          ctx.moveTo(hit.x1, hit.y1);
          ctx.lineTo(hit.x2, hit.y2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawEffect(effect) {
        ctx.save();
        ctx.globalAlpha = clamp(effect.timer / effect.maxTimer, 0, 1);
        ctx.fillStyle = effect.color;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, effect.size, 0, TWO_PI);
        ctx.fill();
        ctx.restore();
      }

      function drawText(text) {
        ctx.save();
        ctx.globalAlpha = clamp(text.timer / text.maxTimer, 0, 1);
        ctx.fillStyle = text.color;
        ctx.font = "900 22px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(text.text, text.x, text.y);
        ctx.restore();
      }

      function drawStickman(px, py, pose, dir, alpha, color) {
        dir = norm(dir.x || 1, dir.y || 0);
        const side = Math.abs(dir.x) > 0.15 ? Math.sign(dir.x) : game.player.face;
        const perp = { x: -dir.y, y: dir.x };

        let neck = { x: px, y: py - 35 };
        let hip = { x: px, y: py - 2 };
        let head = { x: px, y: py - 50 };
        let handA = { x: neck.x + side * 22, y: neck.y + 8 };
        let handB = { x: neck.x - side * 18, y: neck.y + 12 };
        let footA = { x: hip.x + side * 17, y: hip.y + 30 };
        let footB = { x: hip.x - side * 17, y: hip.y + 30 };

        if (pose === "punch") {
          neck.x += dir.x * 8;
          neck.y += dir.y * 3;
          handA = { x: neck.x + dir.x * 52, y: neck.y + dir.y * 46 };
          handB = { x: neck.x - dir.x * 18 - perp.x * 12, y: neck.y - dir.y * 18 - perp.y * 12 };
        }

        if (pose === "big" || pose === "finish" || pose === "dashPunch" || pose === "counter") {
          neck.x += dir.x * 17;
          neck.y += dir.y * 7;
          handA = { x: neck.x + dir.x * 66, y: neck.y + dir.y * 58 };
          handB = { x: neck.x - dir.x * 25 - perp.x * 12, y: neck.y - dir.y * 25 - perp.y * 12 };
          footA = { x: hip.x - dir.x * 25 + perp.x * 13, y: hip.y - dir.y * 20 + perp.y * 13 + 24 };
          footB = { x: hip.x - dir.x * 20 - perp.x * 13, y: hip.y - dir.y * 20 - perp.y * 13 + 25 };
        }

        if (pose === "kick") {
          handA = { x: neck.x + side * 18, y: neck.y + 8 };
          handB = { x: neck.x - side * 21, y: neck.y + 10 };
          footA = { x: hip.x + dir.x * 56, y: hip.y + dir.y * 40 };
          footB = { x: hip.x - side * 18, y: hip.y + 28 };
        }

        if (pose === "spin") {
          const t = game.time * 20;
          handA = { x: neck.x + Math.cos(t) * 34, y: neck.y + Math.sin(t) * 16 };
          handB = { x: neck.x + Math.cos(t + Math.PI) * 34, y: neck.y + Math.sin(t + Math.PI) * 16 };
          footA = { x: hip.x + Math.cos(t + 0.7) * 55, y: hip.y + Math.sin(t + 0.7) * 22 };
          footB = { x: hip.x + Math.cos(t + Math.PI) * 30, y: hip.y + Math.sin(t + Math.PI) * 14 + 22 };
        }

        if (pose === "dash") {
          neck.x += dir.x * 16;
          neck.y += dir.y * 7;
          handA = { x: neck.x - dir.x * 24 + perp.x * 9, y: neck.y - dir.y * 24 + perp.y * 9 };
          handB = { x: neck.x - dir.x * 28 - perp.x * 9, y: neck.y - dir.y * 28 - perp.y * 9 };
        }

        if (pose === "parry") {
          handA = { x: neck.x + dir.x * 26 + perp.x * 12, y: neck.y + dir.y * 26 + perp.y * 12 };
          handB = { x: neck.x + dir.x * 20 - perp.x * 12, y: neck.y + dir.y * 20 - perp.y * 12 };
        }

        if (pose === "hurt") {
          neck.x -= side * 8;
          head.x -= side * 10;
          handA = { x: neck.x - side * 22, y: neck.y + 24 };
          handB = { x: neck.x + side * 8, y: neck.y + 22 };
        }

        if (pose === "limit") {
          neck.y += 8;
          hip.y += 8;
          head.y += 8;
          handA = { x: neck.x + 28, y: neck.y + 32 };
          handB = { x: neck.x - 28, y: neck.y + 32 };
          footA = { x: hip.x + 27, y: hip.y + 28 };
          footB = { x: hip.x - 27, y: hip.y + 28 };
          ctx.save();
          ctx.globalAlpha = alpha * 0.55;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(px, py - 12, 64, 0, TWO_PI);
          ctx.stroke();
          ctx.restore();
        }

        if (pose === "over") {
          neck.y += 12;
          hip.y += 10;
          head.y += 12;
          handA = { x: neck.x + side * 18, y: neck.y + 28 };
          handB = { x: neck.x - side * 18, y: neck.y + 28 };
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        drawLine(neck, hip);
        drawLine(neck, handA);
        drawLine(neck, handB);
        drawLine(hip, footA);
        drawLine(hip, footB);

        ctx.beginPath();
        ctx.arc(head.x, head.y, 12, 0, TWO_PI);
        ctx.stroke();

        ctx.restore();

        const fire = flameColor();
        drawFlame(handA.x, handA.y, pose === "parry" ? "#9de1ff" : fire, 9 + Math.sin(game.time * 35) * 2, alpha);
        drawFlame(handB.x, handB.y, pose === "parry" ? "#9de1ff" : fire, 6, alpha * 0.75);

        if (game.player.fireFeet || game.player.maxCombo >= 5 || game.limit > 0 || pose === "kick" || pose === "spin") {
          drawFlame(footA.x, footA.y, fire, 8, alpha);
          drawFlame(footB.x, footB.y, fire, 6, alpha * 0.75);
        }

        if (pose === "spin") {
          ctx.save();
          ctx.globalAlpha = alpha * 0.72;
          ctx.strokeStyle = fire;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.ellipse(px, py - 10, 62, 22, 0, 0, TWO_PI);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawLine(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawFlame(x, y, color, size, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const gradient = ctx.createRadialGradient(x, y, 1, x, y, size * 2.2);
        gradient.addColorStop(0, "#fff");
        gradient.addColorStop(0.28, color);
        gradient.addColorStop(1, "rgba(255,130,40,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, size * 2.2, 0, TWO_PI);
        ctx.fill();
        ctx.restore();
      }

      function drawUI() {
        const player = game.player;

        ctx.fillStyle = "rgba(0,0,0,0.48)";
        ctx.fillRect(14, 12, W - 28, 82);

        ctx.fillStyle = "#fff";
        ctx.font = "900 18px system-ui";
        ctx.textAlign = "left";
        ctx.fillText("HP", 28, 38);
        drawBar(64, 23, 190, 16, player.hp / player.maxHp, "#ff5b5b");

        ctx.fillText("STAGE " + game.stage, 28, 68);
        drawBar(118, 53, 136, 16, game.stageKills / game.stageGoal, "#69e36d");

        ctx.fillText("점수 " + game.score, 286, 38);
        ctx.fillText("F", 286, 68);
        drawBar(314, 53, 132, 16, game.ult / 100, "#9de1ff");

        ctx.fillStyle = "#d7e3ff";
        ctx.font = "800 13px system-ui";
        ctx.fillText("방향키 이동 · A 손공격 · S 발공격 · D 패링 · Space 대쉬 · Space+A", 480, 38);

        const p = game.player;
        drawCooldownBox(704, 64, "S", p.spinCooldown, 0.92, "발공격");
        drawCooldownBox(762, 64, "D", p.parryCooldown, 0.52, "패링");
        drawCooldownBox(820, 64, "Sp", p.dashCooldown, 0.58, "대쉬");
        drawCooldownBox(878, 64, "F", 100 - game.ult, 100, "필살");

        if (game.combo > 1) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 30px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.combo + " COMBO", W / 2, 126);
        }

        if (p.counterReady > 0) {
          ctx.fillStyle = "#9de1ff";
          ctx.font = "950 22px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("A 반격 가능", p.x, p.y - 100);
        }

        if (game.limit > 0) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 18px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("한계돌파", W / 2, 154);
          drawBar(W / 2 - 128, 162, 256, 12, game.limit / 5, "#ffd84a");
        }
      }

      function drawCooldownBox(x, y, key, cooldown, maxCooldown, label) {
        const ready = cooldown <= 0;
        ctx.save();
        ctx.fillStyle = ready ? "rgba(255,255,255,0.16)" : "rgba(0,0,0,0.5)";
        ctx.strokeStyle = ready ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x - 24, y - 24, 48, 48, 10);
        ctx.fill();
        ctx.stroke();

        if (!ready) {
          const ratio = clamp(cooldown / maxCooldown, 0, 1);
          ctx.fillStyle = "rgba(0,0,0,0.48)";
          ctx.fillRect(x - 24, y - 24, 48, 48 * ratio);
        }

        ctx.fillStyle = ready ? "#ffd84a" : "#fff";
        ctx.font = "900 16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(key, x, y - 3);
        ctx.font = "800 10px system-ui";
        ctx.fillText(label, x, y + 14);
        ctx.restore();
      }

      function drawBar(x, y, w, h, ratio, color) {
        ratio = clamp(ratio, 0, 1);
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w * ratio, h);
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.strokeRect(x, y, w, h);
      }

      function drawModeEffects() {
        if (game.flash > 0) {
          ctx.globalAlpha = clamp(game.flash * 2.2, 0, 0.55);
          ctx.fillStyle = game.limit > 0 || game.cutType === "start" ? "#ffd84a" : "#fff";
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }

        if (game.limit > 0) {
          ctx.globalAlpha = game.limit < 1 ? Math.sin(game.time * 42) * 0.22 + 0.56 : 0.35;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 10;
          ctx.strokeRect(6, 6, W - 12, H - 12);
          ctx.globalAlpha = 1;
        }

        if (game.cutscene) {
          ctx.fillStyle = "rgba(0,0,0,0.42)";
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = game.cutType === "start" ? "#ffd84a" : "#ddd";
          ctx.font = "950 44px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.cutType === "start" ? "한계돌파" : "과부하", W / 2, 210);
        }
      }

      function addParticles(x, y, count, color, power) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, TWO_PI);
          const speed = rand(45, 120) * power;
          game.effects.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed - rand(0, 60),
            gravity: rand(120, 280),
            size: rand(2, 5),
            color,
            timer: rand(0.28, 0.74),
            maxTimer: 0.74
          });
        }
      }

      function addText(x, y, text, color, timer = 0.85) {
        game.texts.push({ x, y, text, color, timer, maxTimer: timer });
      }

      function addRing(x, y, radius, color) {
        game.hits.push({
          circle: true,
          x,
          y,
          radius,
          timer: 0.2,
          color,
          width: 7
        });
      }

      function addGhost(timer) {
        const p = game.player;
        if (game.ghosts[0] && Math.hypot(game.ghosts[0].x - p.x, game.ghosts[0].y - p.y) < 6) return;

        game.ghosts.unshift({
          x: p.x,
          y: p.y,
          pose: p.pose,
          dir: { ...p.dir },
          timer,
          maxTimer: timer,
          gold: game.limit > 0
        });
      }

      function addAfterImage(x, y, r, color) {
        game.effects.push({
          x,
          y,
          vx: 0,
          vy: 0,
          gravity: 0,
          size: r,
          color,
          timer: 0.22,
          maxTimer: 0.22
        });
      }

      function addWallMark(x, y, size) {
        game.wallMarks.push({
          x,
          y,
          size,
          timer: 0.65,
          maxTimer: 0.65,
          color: "#ffdf7e",
          seed: rand(0, TWO_PI)
        });
      }

      function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (!lenSq) return Math.hypot(px - x1, py - y1);
        const t = clamp(((px - x1) * dx + (py - y1) * dy) / lenSq, 0, 1);
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw();
        rafId = requestAnimationFrame(loop);
      }

      resetGame();
      draw();
    })();
  </script>
</body>
</html>
