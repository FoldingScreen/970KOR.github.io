<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메테오 파이터</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050713;
      color: white;
      font-family: system-ui;
    }

    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 110%, #303a68, #050713 55%);
    }

    canvas {
      width: min(100vw, 66.66vh);
      height: min(150vw, 100vh);
      max-width: 480px;
      max-height: 720px;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.68);
      z-index: 3;
    }

    .hide {
      display: none;
    }

    .box {
      width: min(420px, calc(100vw - 28px));
      padding: 25px;
      border-radius: 22px;
      background: #10162fee;
      border: 1px solid #ffffff33;
      text-align: center;
    }

    .title {
      font-size: 38px;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .sub {
      line-height: 1.6;
      opacity: 0.86;
    }

    button {
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 13px 22px;
      background: #ffd43b;
      color: #111;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
    }

    .card {
      margin-top: 10px;
      padding: 14px;
      text-align: left;
      border-radius: 16px;
      background: #202b5c;
      border: 1px solid #ffffff33;
      cursor: pointer;
    }

    .card:hover {
      border-color: #ffd43b;
    }

    .key {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #ffd43b;
      color: #111;
      font-weight: 950;
    }

    .name {
      font-size: 20px;
      font-weight: 950;
      margin-top: 6px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.84;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="c" width="480" height="720"></canvas>

    <div id="start" class="screen">
      <div class="box">
        <div class="title">메테오 파이터</div>
        <div class="sub">
          방향키는 이동이 아니라 <b>공격 방향</b>.<br>
          A 연타로 권각 콤보, Space 대쉬, Space+A 대쉬공격.<br>
          금빛 구슬을 먹으면 한계돌파.
        </div>
        <button id="go">게임 시작</button>
      </div>
    </div>

    <div id="sel" class="screen hide">
      <div class="box">
        <div class="title" style="font-size:30px">수련 선택</div>
        <div id="cards"></div>
      </div>
    </div>

    <div id="over" class="screen hide">
      <div class="box">
        <div class="title">게임 오버</div>
        <div id="result" class="sub"></div>
        <button id="again">다시하기</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");

      const startScreen = document.getElementById("start");
      const selectScreen = document.getElementById("sel");
      const gameOverScreen = document.getElementById("over");
      const cards = document.getElementById("cards");
      const result = document.getElementById("result");
      const go = document.getElementById("go");
      const again = document.getElementById("again");

      const W = 480;
      const H = 720;
      const GROUND = 635;
      const PLAYER_GROUND = 601;

      let keys = {};
      let game;
      let lastTime = 0;
      let rafId = null;
      let picks = [];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function norm(x, y) {
        const d = Math.hypot(x, y) || 1;
        return { x: x / d, y: y / d };
      }

      function newGame() {
        game = {
          run: true,
          time: 0,
          score: 0,
          level: 1,
          xp: 0,
          nextXp: 26,
          hp: 10,
          maxHp: 10,

          combo: 0,
          comboTimer: 0,
          ult: 0,

          spawnTimer: 0,
          orbTimer: rand(18, 27),
          bossTimer: 0,

          hitStop: 0,
          shake: 0,
          flash: 0,

          limit: 0,
          cutscene: false,
          cutType: "",
          cutTimer: 0,
          overheat: 0,

          choosing: false,
          dead: false,

          meteors: [],
          effects: [],
          texts: [],
          hits: [],
          orbs: [],
          ghosts: [],

          player: {
            x: 240,
            y: PLAYER_GROUND,
            vx: 0,
            vy: 0,
            face: 1,
            dir: { x: 0, y: -1 },

            pose: "idle",

            attackCooldown: 0,
            dashCooldown: 0,
            dashTimer: 0,

            lastA: 9,
            lastDash: 9,
            comboStage: 0,

            maxCombo: 1,
            damage: 1,
            range: 68,
            width: 25,
            track: 145,
            lunge: 520,
            dashSpeed: 720,

            dashReset: false,
            shock: 0,
            preview: false,
            limitExtend: false,
            attackBaseCooldown: 0.17
          }
        };
      }

      function startGame() {
        newGame();

        startScreen.classList.add("hide");
        selectScreen.classList.add("hide");
        gameOverScreen.classList.add("hide");

        cancelAnimationFrame(rafId);
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      go.onclick = startGame;
      again.onclick = startGame;

      window.addEventListener("keydown", (e) => {
        keys[e.code] = true;

        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
          e.preventDefault();
        }

        if (!game) return;

        if (game.choosing) {
          if (e.code === "Digit1") pickUpgrade(0);
          if (e.code === "Digit2") pickUpgrade(1);
          if (e.code === "Digit3") pickUpgrade(2);
          return;
        }

        if (game.dead) {
          if (e.code === "KeyR") startGame();
          return;
        }

        if (game.cutscene || e.repeat) return;

        if (e.code === "Space") dash();
        if (e.code === "KeyA") attack();
        if (e.code === "KeyF") ultimate();
      });

      window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      const upgrades = [
        {
          name: "연속정권",
          desc: "A 콤보 2타 해금",
          condition: (p) => p.maxCombo < 2,
          apply: (p) => p.maxCombo = 2
        },
        {
          name: "붕권",
          desc: "A 콤보 3타 해금. 강한 전진타.",
          condition: (p) => p.maxCombo >= 2 && p.maxCombo < 3,
          apply: (p) => p.maxCombo = 3
        },
        {
          name: "올려차기",
          desc: "A 콤보 4타 해금. 위쪽 처리 강화.",
          condition: (p) => p.maxCombo >= 3 && p.maxCombo < 4,
          apply: (p) => p.maxCombo = 4
        },
        {
          name: "파쇄권",
          desc: "A 콤보 5타 해금. 막타 충격파.",
          condition: (p) => p.maxCombo >= 4 && p.maxCombo < 5,
          apply: (p) => p.maxCombo = 5
        },
        {
          name: "추격 보법",
          desc: "추격거리와 공격범위 증가",
          condition: () => true,
          apply: (p) => {
            p.track *= 1.18;
            p.range *= 1.12;
          }
        },
        {
          name: "무영보",
          desc: "공격 이동속도와 대쉬속도 증가",
          condition: () => true,
          apply: (p) => {
            p.lunge *= 1.13;
            p.dashSpeed *= 1.12;
          }
        },
        {
          name: "단전 강화",
          desc: "공격력 +1",
          condition: () => true,
          apply: (p) => p.damage += 1
        },
        {
          name: "연타 호흡",
          desc: "공격 쿨타임 감소",
          condition: () => true,
          apply: (p) => p.attackBaseCooldown *= 0.86
        },
        {
          name: "연쇄돌파",
          desc: "대쉬공격 처치 시 대쉬 초기화",
          condition: (p) => !p.dashReset,
          apply: (p) => p.dashReset = true
        },
        {
          name: "충격파",
          desc: "처치 시 주변 운석 추가 피해",
          condition: () => true,
          apply: (p) => p.shock += 1
        },
        {
          name: "낙하 예측",
          desc: "착탄 지점 표시",
          condition: (p) => !p.preview,
          apply: (p) => p.preview = true
        },
        {
          name: "폭주 연장",
          desc: "한계돌파 중 처치하면 지속시간 증가",
          condition: (p) => !p.limitExtend,
          apply: (p) => p.limitExtend = true
        }
      ];

      function showUpgrades() {
        game.choosing = true;
        selectScreen.classList.remove("hide");

        const pool = upgrades
          .filter((up) => up.condition(game.player))
          .sort(() => Math.random() - 0.5);

        picks = pool.slice(0, 3);
        cards.innerHTML = "";

        picks.forEach((up, i) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span class="key">${i + 1}</span>
            <div class="name">${up.name}</div>
            <div class="desc">${up.desc}</div>
          `;
          card.onclick = () => pickUpgrade(i);
          cards.appendChild(card);
        });
      }

      function pickUpgrade(index) {
        if (!picks[index]) return;

        picks[index].apply(game.player);
        game.choosing = false;
        selectScreen.classList.add("hide");
      }

      function buff() {
        if (game.limit > 0) {
          return {
            speed: 0.38,
            move: 2.25,
            damage: 3,
            range: 1.85,
            track: 2,
            gold: true
          };
        }

        return {
          speed: 1,
          move: 1,
          damage: 1,
          range: 1,
          track: 1,
          gold: false
        };
      }

      function inputDir() {
        let x = 0;
        let y = 0;

        if (keys.ArrowLeft) x -= 1;
        if (keys.ArrowRight) x += 1;
        if (keys.ArrowUp) y -= 1;
        if (keys.ArrowDown) y += 1;

        if (x || y) return norm(x, y);
        return null;
      }

      function findTarget(dir, range, free) {
        const p = game.player;

        let best = null;
        let bestScore = Infinity;

        for (const m of game.meteors) {
          if (m.dead) continue;

          const dx = m.x - p.x;
          const dy = m.y - p.y;
          const d = Math.hypot(dx, dy);

          if (d > range + m.r) continue;

          let dot = 1;

          if (dir) {
            dot = (dx / (d || 1)) * dir.x + (dy / (d || 1)) * dir.y;

            if (dot < 0.25 && !free) continue;
          }

          const urgency = m.y / GROUND;
          const score = d - urgency * 90 - dot * 40;

          if (score < bestScore) {
            bestScore = score;
            best = m;
          }
        }

        return best;
      }

      function aim(range, free) {
        const p = game.player;
        const b = buff();
        const input = inputDir();

        const target = findTarget(input, range * b.track, free);

        if (target) {
          return norm(target.x - p.x, target.y - p.y);
        }

        if (input) return input;

        const autoTarget = findTarget(null, range * 1.3 * b.track, true);

        if (autoTarget) {
          return norm(autoTarget.x - p.x, autoTarget.y - p.y);
        }

        return { x: p.face, y: -0.2 };
      }

      function setPose(name, dir) {
        game.player.pose = name;
        if (dir) game.player.dir = dir;
      }

      function dash() {
        const p = game.player;
        const b = buff();

        if (p.dashCooldown > 0 && game.limit <= 0) return;

        const dir = inputDir() || aim(p.track * 1.2, true);

        p.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : p.face;
        p.dir = dir;

        p.vx = dir.x * p.dashSpeed * b.move;
        p.vy = dir.y * p.dashSpeed * b.move;

        if (dir.y >= -0.15 && p.y >= PLAYER_GROUND - 3) {
          p.vy -= 80 * b.move;
        }

        p.dashCooldown = 0.72 * b.speed;
        p.dashTimer = 0.15;
        p.lastDash = 0;

        setPose("dash", dir);
        addGhost(0.22);
        addParticles(p.x, p.y, 12, b.gold ? "#ffd84a" : "#9de1ff", 2);
      }

      function attack() {
        const p = game.player;
        const b = buff();

        if (game.overheat > 0) return;
        if (p.attackCooldown > 0 && game.limit <= 0) return;

        if (p.dashTimer > 0 || p.lastDash < 0.22 || keys.Space) {
          dashAttack();
          return;
        }

        if (p.lastA > 0.62) {
          p.comboStage = 0;
        }

        p.comboStage = p.comboStage % p.maxCombo + 1;
        p.lastA = 0;

        let stage = p.comboStage;
        let name = "정권";
        let pose = "punch";
        let damage = p.damage;
        let range = p.range;
        let width = p.width;
        let move = p.lunge;
        let cooldown = p.attackBaseCooldown;
        let dir = null;

        if (stage === 2) {
          name = "연속정권";
          damage += 0.5;
          move *= 1.1;
          cooldown *= 0.88;
        }

        if (stage === 3) {
          name = "붕권";
          pose = "big";
          damage += 1.5;
          range *= 1.25;
          width *= 1.15;
          move *= 1.28;
        }

        if (stage === 4) {
          name = "올려차기";
          pose = "kick";
          damage += 1.2;
          range *= 1.34;
          width *= 1.25;

          const a = aim(p.track * 1.4, true);
          dir = norm(a.x * 0.55, -1);
        }

        if (stage === 5) {
          name = "파쇄권";
          pose = "big";
          damage += 3;
          range *= 1.45;
          width *= 1.45;
        }

        strike(
          name,
          pose,
          dir || aim(p.track, false),
          damage,
          range,
          width,
          move,
          cooldown,
          "combo",
          stage
        );
      }

      function dashAttack() {
        const p = game.player;

        const input = inputDir();
        let dir = aim(p.track * 1.8, true);

        let name = "대쉬정권";
        let pose = "dashPunch";
        let damage = p.damage + 1.4;
        let range = p.range * 1.55;
        let width = p.width * 1.2;
        let move = p.lunge * 1.45;

        if (input && input.y < -0.55) {
          name = "비연각";
          pose = "kick";
          dir = norm(dir.x * 0.45 + input.x * 0.22, dir.y * 0.45 - 0.55);
          range *= 1.18;
        }

        if (input && input.y > 0.55 && p.y < PLAYER_GROUND - 15) {
          name = "급강하각";
          pose = "down";
          dir = norm(dir.x * 0.35 + input.x * 0.25, 1);
          damage += 1.3;
          width *= 1.25;
        }

        p.lastA = 0;

        strike(
          name,
          pose,
          dir,
          damage,
          range,
          width,
          move,
          p.attackBaseCooldown * 1.04,
          "dash",
          0
        );
      }

      function strike(name, pose, dir, damage, range, width, move, cooldown, source, stage) {
        const p = game.player;
        const b = buff();

        dir = norm(dir.x, dir.y);

        p.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : p.face;
        p.dir = dir;

        p.vx = dir.x * move * b.move;
        p.vy = dir.y * move * b.move;

        if (dir.y < -0.25) p.vy -= 90 * b.move;
        if (dir.y > 0.3 && p.y >= PLAYER_GROUND - 3) p.vy = -120;

        p.attackCooldown = cooldown * b.speed;
        setPose(pose, dir);

        addText(p.x, p.y - 72, name, b.gold ? "#ffd84a" : "#fff", 0.45);
        addGhost(0.22);

        const sx = p.x;
        const sy = p.y - 24;
        const ex = sx + dir.x * range * b.range;
        const ey = sy + dir.y * range * b.range;

        let killed = false;
        let hit = false;

        game.hits.push({
          x1: sx,
          y1: sy,
          x2: ex,
          y2: ey,
          width: width * b.range,
          timer: 0.13,
          color: b.gold ? "#ffd84a" : source === "dash" ? "#9de1ff" : "#fff"
        });

        for (const m of game.meteors) {
          if (m.dead) continue;

          const d = pointToSegmentDistance(m.x, m.y, sx, sy, ex, ey);

          if (d <= m.r + width * b.range * 0.5) {
            hit = true;

            const didKill = hurtMeteor(
              m,
              Math.ceil(damage * b.damage),
              dir,
              source,
              stage
            );

            if (didKill) killed = true;
          }
        }

        if (hit) {
          game.hitStop = Math.max(game.hitStop, source === "dash" ? 0.05 : 0.035);
          game.shake = Math.max(game.shake, source === "dash" ? 8 : 5);
        }

        if (killed && source === "dash" && p.dashReset) {
          p.dashCooldown = 0;
          addText(p.x, p.y - 100, "연쇄돌파!", "#9de1ff", 0.55);
        }

        if (killed && game.limit > 0 && p.limitExtend && game.limit < 8) {
          game.limit += 0.18;
        }
      }

      function hurtMeteor(m, damage, dir, source, stage) {
        m.hp -= damage;
        m.vx += dir.x * 80;
        m.vy += dir.y * 55 - 25;
        m.flash = 0.12;

        addParticles(
          m.x,
          m.y,
          12 + Math.min(14, damage * 2),
          game.limit > 0 ? "#ffd84a" : "#fff0a8",
          2.5
        );

        addText(m.x, m.y - m.r, "-" + damage, "#fff3a8", 0.5);

        if (game.limit > 0 || stage === 5) {
          explosion(m.x, m.y, game.limit > 0 ? 54 : 42, Math.max(1, Math.floor(damage * 0.45)));
        }

        if (m.hp <= 0) {
          killMeteor(m);
          return true;
        }

        return false;
      }

      function killMeteor(m) {
        if (m.dead) return;

        m.dead = true;

        game.score += m.score;
        game.combo += 1;
        game.comboTimer = 1.15;
        game.ult = clamp(game.ult + 7.5, 0, 100);
        game.xp += m.xp;

        if (game.xp >= game.nextXp) {
          game.xp -= game.nextXp;
          game.level += 1;
          game.nextXp = Math.floor(game.nextXp * 1.25 + 12);
          showUpgrades();
        }

        addText(m.x, m.y, "+" + m.score, "#ffef8a", 0.7);
        addParticles(m.x, m.y, 28, m.color, 3.5);

        if (m.type === "big") {
          addMeteor(m.x - 10, m.y, -70, true);
          addMeteor(m.x + 10, m.y, 70, true);
        }

        if (m.type === "bomb") {
          explosion(m.x, m.y, 72, 2);
        }

        if (game.player.shock) {
          explosion(m.x, m.y, 42 + game.player.shock * 13, game.player.shock);
        }
      }

      function explosion(x, y, radius, damage) {
        game.hits.push({
          circle: true,
          x,
          y,
          radius,
          timer: 0.18,
          color: game.limit > 0 ? "#ffd84a" : "#ffdf7e"
        });

        for (const m of game.meteors) {
          if (m.dead) continue;

          const d = Math.hypot(m.x - x, m.y - y);

          if (d <= radius + m.r) {
            m.hp -= damage;

            if (m.hp <= 0) {
              killMeteor(m);
            }
          }
        }
      }

      function addMeteor(x = rand(38, W - 38), y = -42, vx = rand(-18, 18), fragment = false, boss = false) {
        let type = fragment ? "fragment" : "normal";
        const roll = Math.random();

        if (!fragment && !boss) {
          if (game.time > 15 && roll < 0.13) type = "fast";
          else if (game.time > 25 && roll < 0.27) type = "big";
          else if (game.time > 36 && roll < 0.39) type = "steel";
          else if (game.time > 45 && roll < 0.48) type = "bomb";
          else if (roll > 0.92) type = "crystal";
        }

        if (boss) type = "boss";

        const m = {
          x,
          y,
          vx,
          vy: rand(55, 90) * (1 + game.time / 68),
          r: 21,
          hp: 1,
          maxHp: 1,
          score: 10,
          xp: 8,
          type,
          color: "#9a7755",
          dead: false,
          rot: rand(0, 7),
          vr: rand(-2, 2),
          flash: 0,
          shape: Array.from({ length: 9 }, () => rand(0.78, 1.22))
        };

        if (type === "fragment") {
          m.r = 14;
          m.vy = rand(80, 120);
          m.score = 8;
          m.xp = 5;
          m.color = "#bd8a5b";
        }

        if (type === "fast") {
          m.r = 16;
          m.vy *= 1.55;
          m.score = 16;
          m.xp = 10;
          m.color = "#ff644d";
        }

        if (type === "big") {
          m.r = 34;
          m.hp = 3;
          m.maxHp = 3;
          m.vy *= 0.82;
          m.score = 30;
          m.xp = 18;
          m.color = "#b17a4c";
        }

        if (type === "steel") {
          m.r = 25;
          m.hp = 5;
          m.maxHp = 5;
          m.vy *= 0.86;
          m.score = 36;
          m.xp = 22;
          m.color = "#92a0b0";
        }

        if (type === "bomb") {
          m.r = 24;
          m.hp = 2;
          m.maxHp = 2;
          m.score = 34;
          m.xp = 20;
          m.color = "#ff9d25";
        }

        if (type === "crystal") {
          m.r = 22;
          m.score = 20;
          m.xp = 28;
          m.color = "#75ecff";
        }

        if (type === "boss") {
          m.x = rand(110, W - 110);
          m.y = -90;
          m.r = 58;
          m.vx = rand(-12, 12);
          m.vy = 42 + game.time * 0.08;
          m.hp = 18 + game.level * 4;
          m.maxHp = m.hp;
          m.score = 260;
          m.xp = 90;
          m.color = "#d9554e";
        }

        game.meteors.push(m);
      }

      function ultimate() {
        if (game.ult < 100) return;

        game.ult = 0;
        game.flash = 0.35;
        game.shake = 16;

        addText(W / 2, 140, "유성난무!", "#9de1ff", 1);

        for (const m of game.meteors) {
          killMeteor(m);
        }
      }

      function startLimitBreak() {
        game.cutscene = true;
        game.cutType = "start";
        game.cutTimer = 0;
        game.flash = 0.2;
        game.shake = 12;

        setPose("limit", { x: 0, y: -1 });
        addText(game.player.x, game.player.y - 94, "한계돌파!", "#ffd84a", 1.2);
      }

      function endLimitBreak() {
        game.limit = 0;
        game.cutscene = true;
        game.cutType = "end";
        game.cutTimer = 0;
        game.overheat = 0.42;
        game.shake = 8;

        setPose("over", { x: 0, y: 1 });
        addText(game.player.x, game.player.y - 88, "과부하", "#ddd", 0.75);
      }

      function update(dt) {
        if (!game.run || game.choosing || game.dead) return;

        if (game.hitStop > 0) {
          game.hitStop -= dt;
          return;
        }

        if (game.cutscene) {
          game.cutTimer += dt;

          if (game.cutType === "start" && game.cutTimer > 1.05) {
            game.cutscene = false;
            game.limit = 5;
            game.flash = 0.35;
            game.shake = 16;
            game.player.attackCooldown = 0;
            game.player.dashCooldown = 0;
            addParticles(game.player.x, game.player.y - 30, 54, "#ffd84a", 5);
          }

          if (game.cutType === "end" && game.cutTimer > 0.48) {
            game.cutscene = false;
          }

          updateVisuals(dt);
          return;
        }

        game.time += dt;

        if (game.flash > 0) game.flash -= dt;
        if (game.shake > 0) game.shake -= 30 * dt;

        const p = game.player;

        p.attackCooldown = Math.max(0, p.attackCooldown - dt);
        p.dashCooldown = Math.max(0, p.dashCooldown - dt);
        p.dashTimer = Math.max(0, p.dashTimer - dt);
        p.lastA += dt;
        p.lastDash += dt;

        if (game.overheat > 0) game.overheat -= dt;

        if (p.lastA > 0.62) {
          p.comboStage = 0;
        }

        if (game.comboTimer > 0) {
          game.comboTimer -= dt;

          if (game.comboTimer <= 0) {
            game.combo = 0;
          }
        }

        if (game.limit > 0) {
          game.limit -= dt;

          if (game.limit <= 0) {
            endLimitBreak();
            return;
          }
        }

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= Math.pow(0.05, dt);
        p.vy += 980 * dt;

        p.x = clamp(p.x, 28, W - 28);

        if (p.y > PLAYER_GROUND) {
          p.y = PLAYER_GROUND;

          if (p.vy > 0) {
            p.vy = 0;
          }
        }

        if (p.y < 130) {
          p.y = 130;

          if (p.vy < 0) {
            p.vy *= -0.15;
          }
        }

        if (Math.abs(p.vx) + Math.abs(p.vy) > 260 || game.limit > 0) {
          addGhost(0.16);
        }

        game.spawnTimer -= dt;

        if (game.spawnTimer <= 0) {
          addMeteor();

          const interval = clamp(1.02 - game.time * 0.0065, 0.34, 1.02);
          game.spawnTimer = rand(interval * 0.58, interval * 1.1);
        }

        game.bossTimer += dt;

        if (game.time > 32 && game.bossTimer > 45) {
          game.bossTimer = 0;
          addMeteor(0, 0, 0, false, true);
          addText(W / 2, 118, "거대 운석 접근!", "#ff6a6a", 1);
        }

        game.orbTimer -= dt;

        if (game.time > 15 && game.orbTimer <= 0) {
          game.orbTimer = rand(24, 34);

          game.orbs.push({
            x: rand(55, W - 55),
            y: -35,
            vy: 46,
            r: 15,
            spin: 0,
            life: 8,
            dead: false
          });

          addText(W / 2, 122, "금빛 구슬 출현!", "#ffd84a", 1);
        }

        updateMeteors(dt);
        updateOrbs(dt);
        updateVisuals(dt);
      }

      function updateMeteors(dt) {
        for (const m of game.meteors) {
          const slow = game.limit > 0 ? 0.82 : 1;

          m.x += m.vx * dt * slow;
          m.y += m.vy * dt * slow;
          m.rot += m.vr * dt;
          m.flash = Math.max(0, m.flash - dt);

          if (m.x < m.r || m.x > W - m.r) {
            m.vx *= -0.8;
          }

          m.x = clamp(m.x, m.r, W - m.r);

          if (m.y + m.r >= GROUND) {
            m.dead = true;

            let damage = 1;

            if (m.type === "bomb") damage = 3;
            if (m.type === "big" || m.type === "steel") damage = 2;
            if (m.type === "boss") damage = 5;

            game.hp -= damage;
            game.combo = 0;
            game.shake = 10;

            addText(m.x, GROUND - 24, "-" + damage + " HP", "#ff5b5b", 0.8);

            if (game.hp <= 0) {
              game.dead = true;
              game.run = false;

              result.innerHTML = `
                점수: <b>${game.score}</b><br>
                생존 시간: <b>${Math.floor(game.time)}초</b><br>
                도달 레벨: <b>${game.level}</b>
              `;

              gameOverScreen.classList.remove("hide");
            }
          }
        }

        game.meteors = game.meteors.filter((m) => !m.dead);
      }

      function updateOrbs(dt) {
        const p = game.player;

        for (const o of game.orbs) {
          o.y += o.vy * dt;
          o.spin += dt * 4;
          o.life -= dt;

          if (Math.hypot(o.x - p.x, o.y - (p.y - 28)) < o.r + 28) {
            o.dead = true;
            startLimitBreak();
          }

          if (o.y > GROUND + 40 || o.life <= 0) {
            o.dead = true;
          }
        }

        game.orbs = game.orbs.filter((o) => !o.dead);
      }

      function updateVisuals(dt) {
        for (const h of game.hits) {
          h.timer -= dt;
        }

        game.hits = game.hits.filter((h) => h.timer > 0);

        for (const f of game.effects) {
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy += 240 * dt;
          f.timer -= dt;
        }

        game.effects = game.effects.filter((f) => f.timer > 0);

        for (const t of game.texts) {
          t.y -= 34 * dt;
          t.timer -= dt;
        }

        game.texts = game.texts.filter((t) => t.timer > 0);

        for (const gh of game.ghosts) {
          gh.timer -= dt;
        }

        game.ghosts = game.ghosts.filter((gh) => gh.timer > 0);
      }

      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        if (game && game.shake > 0) {
          ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
        }

        drawBackground();

        if (game.player.preview) {
          drawPreviews();
        }

        for (const o of game.orbs) drawOrb(o);
        for (const m of game.meteors) drawMeteor(m);
        for (const h of game.hits) drawHit(h);

        for (const f of game.effects) {
          ctx.globalAlpha = clamp(f.timer / f.maxTimer, 0, 1);
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        for (const gh of game.ghosts) {
          drawStickman(
            gh.x,
            gh.y,
            gh.pose,
            gh.dir,
            clamp(gh.timer / gh.maxTimer, 0, 1) * 0.32,
            gh.gold ? "#ffd84a" : "#9de1ff"
          );
        }

        drawStickman(
          game.player.x,
          game.player.y,
          game.player.pose,
          game.player.dir,
          1,
          game.limit > 0 ? "#ffd84a" : "#fff"
        );

        for (const t of game.texts) {
          ctx.globalAlpha = clamp(t.timer / t.maxTimer, 0, 1);
          ctx.fillStyle = t.color;
          ctx.font = "900 22px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(t.text, t.x, t.y);
          ctx.globalAlpha = 1;
        }

        drawUI();
        drawModeEffects();

        ctx.restore();
      }

      function drawBackground() {
        const gr = ctx.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, "#060817");
        gr.addColorStop(0.58, "#101936");
        gr.addColorStop(1, "#22283d");

        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = 0.45;
        ctx.fillStyle = "#fff";

        for (let i = 0; i < 75; i++) {
          ctx.beginPath();
          ctx.arc((i * 97.3) % W, (i * 53.1) % 390, (i % 3) * 0.55 + 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.fillStyle = "#20273a";
        ctx.fillRect(0, GROUND, W, H - GROUND);

        ctx.fillStyle = "#334062";
        ctx.fillRect(0, GROUND, W, 8);
      }

      function drawPreviews() {
        for (const m of game.meteors) {
          const t = (GROUND - m.y) / Math.max(1, m.vy);
          const px = clamp(m.x + m.vx * t, m.r, W - m.r);

          ctx.globalAlpha = 0.32;
          ctx.fillStyle = "#ffd84a";
          ctx.beginPath();
          ctx.ellipse(px, GROUND + 6, m.r * 0.7, 5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function drawOrb(o) {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.spin);

        const gr = ctx.createRadialGradient(0, 0, 3, 0, 0, 32);
        gr.addColorStop(0, "#fff");
        gr.addColorStop(0.32, "#fff08a");
        gr.addColorStop(1, "rgba(255,216,74,0)");

        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff4a8";
        ctx.beginPath();
        ctx.arc(0, 0, o.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawMeteor(m) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rot);

        ctx.fillStyle = m.flash > 0 ? "#fff" : m.color;
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;

        ctx.beginPath();

        m.shape.forEach((q, i) => {
          const a = Math.PI * 2 * i / m.shape.length;
          const x = Math.cos(a) * m.r * q;
          const y = Math.sin(a) * m.r * q;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });

        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        if (m.maxHp > 1) {
          const w = m.r * 1.8;
          const ratio = clamp(m.hp / m.maxHp, 0, 1);

          ctx.fillStyle = "#0008";
          ctx.fillRect(m.x - w / 2, m.y - m.r - 13, w, 5);

          ctx.fillStyle = m.type === "boss" ? "#ff5555" : "#ffd84a";
          ctx.fillRect(m.x - w / 2, m.y - m.r - 13, w * ratio, 5);
        }
      }

      function drawHit(h) {
        ctx.save();
        ctx.globalAlpha = clamp(h.timer / 0.13, 0, 1);

        if (h.circle) {
          ctx.strokeStyle = h.color;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.lineCap = "round";

          ctx.strokeStyle = h.color;
          ctx.lineWidth = h.width;
          ctx.beginPath();
          ctx.moveTo(h.x1, h.y1);
          ctx.lineTo(h.x2, h.y2);
          ctx.stroke();

          ctx.strokeStyle = "#fff";
          ctx.lineWidth = Math.max(2, h.width * 0.16);
          ctx.beginPath();
          ctx.moveTo(h.x1, h.y1);
          ctx.lineTo(h.x2, h.y2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawStickman(px, py, pose, dir, alpha, color) {
        dir = norm(dir.x || 0, dir.y || -1);

        const side = Math.abs(dir.x) > 0.15 ? Math.sign(dir.x) : game.player.face;
        const perp = { x: -dir.y, y: dir.x };

        let neck = { x: px, y: py - 44 };
        let hip = { x: px, y: py - 8 };
        let head = { x: px, y: py - 59 };

        let armA = { x: neck.x + side * 20, y: neck.y + 8 };
        let armB = { x: neck.x - side * 18, y: neck.y + 13 };
        let legA = { x: hip.x + side * 18, y: hip.y + 34 };
        let legB = { x: hip.x - side * 18, y: hip.y + 34 };

        if (pose === "punch") {
          neck.x += dir.x * 8;
          armA = { x: neck.x + dir.x * 48, y: neck.y + dir.y * 48 };
          armB = {
            x: neck.x - dir.x * 18 - perp.x * 12,
            y: neck.y - dir.y * 18 - perp.y * 12
          };
        }

        if (pose === "big" || pose === "dashPunch") {
          neck.x += dir.x * 16;

          armA = { x: neck.x + dir.x * 62, y: neck.y + dir.y * 62 };
          armB = {
            x: neck.x - dir.x * 25 - perp.x * 12,
            y: neck.y - dir.y * 25 - perp.y * 12
          };

          legA = {
            x: hip.x - dir.x * 30 + perp.x * 16,
            y: hip.y - dir.y * 30 + perp.y * 16 + 27
          };

          legB = {
            x: hip.x - dir.x * 24 - perp.x * 16,
            y: hip.y - dir.y * 24 - perp.y * 16 + 29
          };
        }

        if (pose === "kick") {
          const up = norm(dir.x * 0.55, -1);

          armA = { x: neck.x + up.x * 25 + side * 12, y: neck.y + up.y * 25 };
          legA = { x: hip.x + up.x * 20 + side * 6, y: hip.y + up.y * 52 };
          legB = { x: hip.x - side * 22, y: hip.y + 32 };
        }

        if (pose === "down") {
          legA = { x: hip.x + dir.x * 28, y: hip.y + 54 };
          legB = { x: hip.x - side * 20, y: hip.y + 18 };
        }

        if (pose === "dash") {
          neck.x += dir.x * 16;

          armA = {
            x: neck.x - dir.x * 24 + perp.x * 9,
            y: neck.y - dir.y * 24 + perp.y * 9
          };

          armB = {
            x: neck.x - dir.x * 30 - perp.x * 9,
            y: neck.y - dir.y * 30 - perp.y * 9
          };

          legA = {
            x: hip.x - dir.x * 28 + perp.x * 14,
            y: hip.y - dir.y * 28 + perp.y * 14 + 26
          };

          legB = {
            x: hip.x - dir.x * 16 - perp.x * 14,
            y: hip.y - dir.y * 16 - perp.y * 14 + 30
          };
        }

        if (pose === "limit") {
          neck.y += 9;
          hip.y += 10;
          head.y += 8;

          armA = { x: neck.x + 24, y: neck.y + 32 };
          armB = { x: neck.x - 24, y: neck.y + 32 };
          legA = { x: hip.x + 25, y: hip.y + 30 };
          legB = { x: hip.x - 25, y: hip.y + 30 };

          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(px, py - 32, 70, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (pose === "over") {
          neck.y += 16;
          hip.y += 10;
          head.y += 14;
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        line(neck, hip);
        line(neck, armA);
        line(neck, armB);
        line(hip, legA);
        line(hip, legB);

        ctx.beginPath();
        ctx.arc(head.x, head.y, 12, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function line(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawUI() {
        ctx.fillStyle = "#0006";
        ctx.fillRect(12, 12, W - 24, 86);

        ctx.fillStyle = "#fff";
        ctx.font = "900 18px system-ui";
        ctx.textAlign = "left";

        ctx.fillText("점수 " + game.score, 24, 38);
        ctx.fillText("Lv." + game.level, 24, 66);

        ctx.fillText("방어선", 104, 38);
        drawBar(174, 23, 132, 16, game.hp / game.maxHp, "#ff5c5c");

        ctx.fillText("경험치", 104, 66);
        drawBar(174, 51, 132, 16, game.xp / game.nextXp, "#69e36d");

        ctx.fillText("F", 326, 38);
        drawBar(350, 23, 92, 16, game.ult / 100, "#9de1ff");

        ctx.fillStyle = "#d7e3ff";
        ctx.font = "800 13px system-ui";
        ctx.fillText("A 콤보 · Space 대쉬 · Space+A", 24, 88);

        if (game.combo > 1) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 30px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.combo + " COMBO", W / 2, 130);
        }

        if (game.limit > 0) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 18px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("한계돌파", W / 2, 164);
          drawBar(112, 174, 256, 12, game.limit / 5, "#ffd84a");
        }
      }

      function drawBar(x, y, w, h, ratio, color) {
        ratio = clamp(ratio, 0, 1);

        ctx.fillStyle = "#ffffff26";
        ctx.fillRect(x, y, w, h);

        ctx.fillStyle = color;
        ctx.fillRect(x, y, w * ratio, h);

        ctx.strokeStyle = "#ffffff55";
        ctx.strokeRect(x, y, w, h);
      }

      function drawModeEffects() {
        if (game.flash > 0) {
          ctx.globalAlpha = clamp(game.flash * 2.2, 0, 0.6);
          ctx.fillStyle = game.limit > 0 || game.cutType === "start" ? "#ffd84a" : "#fff";
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }

        if (game.limit > 0) {
          ctx.globalAlpha = game.limit < 1 ? Math.sin(game.time * 40) * 0.2 + 0.55 : 0.35;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, W - 10, H - 10);
          ctx.globalAlpha = 1;
        }

        if (game.cutscene) {
          ctx.fillStyle = "#0005";
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = game.cutType === "start" ? "#ffd84a" : "#ddd";
          ctx.font = "950 42px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.cutType === "start" ? "한계돌파" : "과부하", W / 2, 245);
        }
      }

      function addParticles(x, y, count, color, power) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const s = rand(45, 120) * power;

          game.effects.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - rand(20, 90),
            size: rand(2, 4.8),
            color,
            timer: rand(0.28, 0.72),
            maxTimer: 0.72
          });
        }
      }

      function addText(x, y, text, color, timer = 0.85) {
        game.texts.push({
          x,
          y,
          text,
          color,
          timer,
          maxTimer: timer
        });
      }

      function addGhost(timer) {
        const p = game.player;

        if (
          game.ghosts[0] &&
          Math.hypot(game.ghosts[0].x - p.x, game.ghosts[0].y - p.y) < 6
        ) {
          return;
        }

        game.ghosts.unshift({
          x: p.x,
          y: p.y,
          pose: p.pose,
          dir: { ...p.dir },
          timer,
          maxTimer: timer,
          gold: game.limit > 0
        });
      }

      function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;

        if (!lenSq) return Math.hypot(px - x1, py - y1);

        const t = clamp(((px - x1) * dx + (py - y1) * dy) / lenSq, 0, 1);

        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);
        draw();

        rafId = requestAnimationFrame(loop);
      }

      newGame();
      draw();
    })();
  </script>
</body>
</html>
