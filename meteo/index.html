<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메테오 슬래셔</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    background: #050816;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
  }

  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 120%, #24304f 0%, #050816 50%, #02030a 100%);
  }

  canvas {
    width: min(100vw, 177.77vh);
    height: min(56.25vw, 100vh);
    background: transparent;
    display: block;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.62);
    z-index: 10;
  }

  .hidden { display: none !important; }

  .panel {
    width: min(760px, calc(100vw - 28px));
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 24px;
    background: rgba(10, 14, 34, 0.92);
    box-shadow: 0 18px 60px rgba(0,0,0,0.45);
    text-align: center;
  }

  .title {
    font-size: 44px;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: -1px;
  }

  .subtitle {
    opacity: 0.84;
    line-height: 1.7;
    margin-bottom: 22px;
  }

  button {
    border: 0;
    border-radius: 14px;
    padding: 13px 22px;
    background: #ffcc33;
    color: #151515;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }

  button:hover { filter: brightness(1.06); }

  #choiceScreen {
    place-items: center;
    background: rgba(0,0,0,0.45);
  }

  .choiceTitle {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 18px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .card {
    min-height: 170px;
    padding: 18px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.25);
    background: linear-gradient(180deg, rgba(39,52,96,0.95), rgba(16,22,50,0.95));
    cursor: pointer;
    text-align: left;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #ffcc33;
  }

  .cardKey {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: #ffcc33;
    color: #111;
    font-weight: 900;
    margin-bottom: 12px;
  }

  .cardName {
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .cardDesc {
    opacity: 0.82;
    line-height: 1.45;
  }

  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    .title { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="startScreen" class="screen">
    <div class="panel">
      <div class="title">메테오 슬래셔</div>
      <div class="subtitle">
        키보드만으로 조작하는 운석 베기 로그라이트.<br>
        방향키로 이동하고, 자동조준 스킬로 떨어지는 운석을 부숴라.<br><br>
        ← / → 이동 · Space 대시 · A 기본참 · S 반월참 · D 승천참 · F 천공참
      </div>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>

  <div id="choiceScreen" class="screen hidden">
    <div class="panel">
      <div class="choiceTitle">강화 선택</div>
      <div id="choiceCards" class="cards"></div>
    </div>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <div class="panel">
      <div class="title">게임 오버</div>
      <div id="finalText" class="subtitle"></div>
      <button id="restartBtn">다시하기</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const startScreen = document.getElementById("startScreen");
  const choiceScreen = document.getElementById("choiceScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const choiceCards = document.getElementById("choiceCards");
  const finalText = document.getElementById("finalText");

  const W = 960;
  const H = 540;
  const groundY = 470;

  let keys = {};
  let lastTime = 0;
  let rafId = null;
  let game;
  let currentChoices = [];

  const rand = (min, max) => Math.random() * (max - min) + min;
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function resetGame() {
    game = {
      running: true,
      choosing: false,
      gameOver: false,

      time: 0,
      score: 0,
      level: 1,
      xp: 0,
      xpNeed: 35,
      baseHp: 10,
      maxBaseHp: 10,
      combo: 0,
      comboTimer: 0,

      ult: 0,
      ultMax: 100,

      spawnTimer: 0,
      bossTimer: 0,

      meteors: [],
      slashes: [],
      particles: [],
      texts: [],

      player: {
        x: W / 2,
        y: groundY,
        facing: 1,

        speed: 300,
        dashSpeed: 700,
        dashTime: 0,
        dashDuration: 0.13,
        dashCooldown: 0,
        dashCooldownMax: 0.95,

        damage: 1,
        slashLength: 150,
        slashWidth: 27,
        slashCount: 1,
        autoRange: 260,

        cooldownMul: 1,
        skillCooldownMul: 1,

        xpGain: 1,
        ultGain: 1,
        shock: 0,
        preview: false,

        cooldowns: {
          a: 0,
          s: 0,
          d: 0
        }
      }
    };
  }

  function startGame() {
    resetGame();
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    choiceScreen.classList.add("hidden");

    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;

    if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
      e.preventDefault();
    }

    if (!game) return;

    if (game.choosing) {
      if (e.code === "Digit1") pickChoice(0);
      if (e.code === "Digit2") pickChoice(1);
      if (e.code === "Digit3") pickChoice(2);
      return;
    }

    if (game.gameOver) {
      if (e.code === "KeyR") startGame();
      return;
    }

    if (e.repeat) return;

    if (e.code === "Space") dash();
    if (e.code === "KeyA") useSkillA();
    if (e.code === "KeyS") useSkillS();
    if (e.code === "KeyD") useSkillD();
    if (e.code === "KeyF") useUltimate();
  });

  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });

  const upgradePool = [
    {
      name: "검 길이 증가",
      desc: "모든 베기 범위가 16% 증가한다.",
      apply: () => game.player.slashLength *= 1.16
    },
    {
      name: "검폭 확장",
      desc: "칼 판정 폭이 18% 증가한다.",
      apply: () => game.player.slashWidth *= 1.18
    },
    {
      name: "칼날 강화",
      desc: "모든 스킬 피해량이 1 증가한다.",
      apply: () => game.player.damage += 1
    },
    {
      name: "공격 템포",
      desc: "A 기본참 쿨타임이 15% 감소한다.",
      apply: () => game.player.cooldownMul *= 0.85
    },
    {
      name: "스킬 순환",
      desc: "S, D 스킬 쿨타임이 14% 감소한다.",
      apply: () => game.player.skillCooldownMul *= 0.86
    },
    {
      name: "가벼운 발놀림",
      desc: "이동속도가 12% 증가한다.",
      apply: () => game.player.speed *= 1.12
    },
    {
      name: "순간 대시",
      desc: "대시 쿨타임이 줄고 대시 거리가 증가한다.",
      apply: () => {
        game.player.dashCooldownMax *= 0.82;
        game.player.dashDuration *= 1.08;
      }
    },
    {
      name: "자동조준 강화",
      desc: "자동조준 탐색 범위가 22% 증가한다.",
      apply: () => game.player.autoRange *= 1.22
    },
    {
      name: "이중 베기",
      desc: "A 기본참 사용 시 칼날이 하나 더 나간다.",
      apply: () => game.player.slashCount += 1
    },
    {
      name: "방어선 보강",
      desc: "최대 체력과 현재 체력이 2 증가한다.",
      apply: () => {
        game.maxBaseHp += 2;
        game.baseHp = Math.min(game.maxBaseHp, game.baseHp + 2);
      }
    },
    {
      name: "경험치 흡수",
      desc: "운석 파괴 경험치 획득량이 18% 증가한다.",
      apply: () => game.player.xpGain *= 1.18
    },
    {
      name: "별빛 충전",
      desc: "궁극기 게이지 획득량이 25% 증가한다.",
      apply: () => game.player.ultGain *= 1.25
    },
    {
      name: "충격파",
      desc: "운석 파괴 시 주변 운석에도 약한 피해를 준다.",
      apply: () => game.player.shock += 1
    },
    {
      name: "낙하지점 예측",
      desc: "운석이 떨어질 위치가 바닥에 표시된다.",
      apply: () => game.player.preview = true
    }
  ];

  function showChoices() {
    game.choosing = true;
    choiceScreen.classList.remove("hidden");

    const pool = [...upgradePool].sort(() => Math.random() - 0.5);
    currentChoices = pool.slice(0, 3);

    choiceCards.innerHTML = "";

    currentChoices.forEach((up, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="cardKey">${i + 1}</div>
        <div class="cardName">${up.name}</div>
        <div class="cardDesc">${up.desc}</div>
      `;
      card.addEventListener("click", () => pickChoice(i));
      choiceCards.appendChild(card);
    });
  }

  function pickChoice(index) {
    if (!game || !game.choosing || !currentChoices[index]) return;

    currentChoices[index].apply();
    game.choosing = false;
    choiceScreen.classList.add("hidden");
  }

  function dash() {
    const p = game.player;
    if (p.dashCooldown > 0 || p.dashTime > 0) return;

    let dir = 0;
    if (keys.ArrowLeft) dir -= 1;
    if (keys.ArrowRight) dir += 1;
    if (dir === 0) dir = p.facing;

    p.facing = dir;
    p.dashTime = p.dashDuration;
    p.dashCooldown = p.dashCooldownMax;

    addParticles(p.x, p.y - 20, 12, "#9bdcff", 2.2);
  }

  function useSkillA() {
    const p = game.player;
    if (p.cooldowns.a > 0) return;

    p.cooldowns.a = 0.24 * p.cooldownMul;

    const baseAngle = getAutoAngle(p.autoRange, false);
    const count = p.slashCount;
    const spread = count === 1 ? 0 : 0.15;

    for (let i = 0; i < count; i++) {
      const offset = (i - (count - 1) / 2) * spread;
      createSlash(baseAngle + offset, p.slashLength, p.slashWidth, p.damage, 0.13, "#ffffff");
    }
  }

  function useSkillS() {
    const p = game.player;
    if (p.cooldowns.s > 0) return;

    p.cooldowns.s = 1.05 * p.skillCooldownMul;

    const baseAngle = getAutoAngle(p.autoRange * 1.05, false);
    const angles = [baseAngle - 0.38, baseAngle, baseAngle + 0.38];

    for (const angle of angles) {
      createSlash(angle, p.slashLength * 1.12, p.slashWidth * 0.95, Math.max(1, p.damage), 0.17, "#ffef9a");
    }

    addText(p.x, p.y - 128, "반월참", "#ffef9a");
  }

  function useSkillD() {
    const p = game.player;
    if (p.cooldowns.d > 0) return;

    p.cooldowns.d = 2.2 * p.skillCooldownMul;

    const angle = getAutoAngle(p.autoRange * 1.8, true);
    createSlash(angle, p.slashLength * 1.78, p.slashWidth * 1.35, p.damage * 2 + 1, 0.22, "#9bdcff");

    addText(p.x, p.y - 128, "승천참", "#9bdcff");
  }

  function useUltimate() {
    if (game.ult < game.ultMax || game.choosing || game.gameOver) return;

    game.ult = 0;
    addText(W / 2, 110, "천공참!", "#9bdcff");

    for (let i = 0; i < 5; i++) {
      const x = 150 + i * 165;

      game.slashes.push({
        x1: x,
        y1: groundY - 8,
        x2: x + rand(-70, 70),
        y2: 55,
        age: 0,
        life: 0.34,
        width: 74,
        color: "#9bdcff"
      });
    }

    for (const m of game.meteors) {
      if (m.dead) continue;

      if (m.boss) {
        m.hp -= 12 + game.player.damage * 2;
        addText(m.x, m.y, "보스 타격!", "#9bdcff");
        if (m.hp <= 0) destroyMeteor(m);
      } else {
        m.dead = true;
        game.score += m.score;
        addXP(m.exp * game.player.xpGain);
        addParticles(m.x, m.y, 24, "#9bdcff", 4.2);
      }
    }
  }

  function getAutoAngle(range, longRange) {
    const p = game.player;
    const sx = p.x;
    const sy = p.y - 58;

    let best = null;
    let bestScore = Infinity;

    for (const m of game.meteors) {
      if (m.dead) continue;
      if (m.y > groundY - 18) continue;

      const dx = m.x - sx;
      const dy = m.y - sy;
      const d = Math.hypot(dx, dy);

      if (!longRange && d > range + m.r) continue;
      if (longRange && d > range + 120 + m.r) continue;

      const urgency = m.y / groundY;
      const centerBonus = Math.abs(dx) * 0.12;
      const score = d + centerBonus - urgency * 95;

      if (score < bestScore) {
        bestScore = score;
        best = m;
      }
    }

    if (!best) {
      return p.facing === 1 ? -Math.PI / 2 + 0.08 : -Math.PI / 2 - 0.08;
    }

    let angle = Math.atan2(best.y - sy, best.x - sx);
    angle = clamp(angle, -Math.PI + 0.25, -0.12);

    return angle;
  }

  function createSlash(angle, length, width, damage, life, color) {
    const p = game.player;

    const sx = p.x;
    const sy = p.y - 58;
    const ex = sx + Math.cos(angle) * length;
    const ey = sy + Math.sin(angle) * length;

    game.slashes.push({
      x1: sx,
      y1: sy,
      x2: ex,
      y2: ey,
      age: 0,
      life,
      width,
      color
    });

    addParticles(ex, ey, 8, color, 1.5);

    for (const m of game.meteors) {
      if (m.dead) continue;

      const dist = pointToSegmentDistance(m.x, m.y, sx, sy, ex, ey);
      if (dist <= m.r + width * 0.5) {
        hitMeteor(m, damage, angle);
      }
    }
  }

  function hitMeteor(m, damage, angle) {
    m.hp -= damage;
    m.vx += Math.cos(angle) * 35;
    m.vy += Math.sin(angle) * 20;

    addParticles(m.x, m.y, 12, "#ffdf7a", 2.4);
    addText(m.x, m.y - m.r, "-" + damage, "#fff2a8");

    if (m.hp <= 0) {
      destroyMeteor(m);
    }
  }

  function destroyMeteor(m) {
    if (m.dead) return;

    m.dead = true;

    game.score += m.score;
    game.combo += 1;
    game.comboTimer = 1.3;
    game.ult = clamp(game.ult + 8 * game.player.ultGain, 0, game.ultMax);

    addXP(m.exp * game.player.xpGain);

    addText(m.x, m.y, "+" + m.score, "#ffef8a");
    addParticles(m.x, m.y, 28, m.color, 3.4);

    if (m.type === "big" && !m.boss) {
      spawnFragment(m.x - 12, m.y, -95);
      spawnFragment(m.x + 12, m.y, 95);
    }

    if (m.type === "bomb") {
      explode(m.x, m.y, 96, 2);
    }

    if (game.player.shock > 0) {
      explode(m.x, m.y, 55 + game.player.shock * 17, game.player.shock);
    }
  }

  function explode(x, y, radius, damage) {
    addParticles(x, y, 42, "#ff9f43", 5);

    game.slashes.push({
      x1: x - radius,
      y1: y,
      x2: x + radius,
      y2: y,
      age: 0,
      life: 0.18,
      width: radius * 1.1,
      color: "#ffda78",
      circle: true,
      x,
      y,
      radius
    });

    for (const m of game.meteors) {
      if (m.dead) continue;

      const d = Math.hypot(m.x - x, m.y - y);
      if (d <= radius + m.r) {
        m.hp -= damage;
        if (m.hp <= 0) destroyMeteor(m);
      }
    }
  }

  function addXP(amount) {
    game.xp += amount;

    if (game.xp >= game.xpNeed && !game.choosing) {
      game.xp -= game.xpNeed;
      game.level += 1;
      game.xpNeed = Math.floor(game.xpNeed * 1.24 + 12);
      showChoices();
    }
  }

  function spawnMeteor(forceBoss = false) {
    const difficulty = 1 + game.time / 55;
    let type = "normal";

    if (forceBoss) {
      type = "boss";
    } else {
      const roll = Math.random();

      if (game.time > 18 && roll < 0.13) type = "fast";
      if (game.time > 28 && roll >= 0.13 && roll < 0.27) type = "big";
      if (game.time > 38 && roll >= 0.27 && roll < 0.39) type = "steel";
      if (game.time > 45 && roll >= 0.39 && roll < 0.49) type = "bomb";
      if (roll > 0.91) type = "crystal";
    }

    const base = {
      x: rand(40, W - 40),
      y: -40,
      vx: rand(-25, 25) * difficulty,
      vy: rand(65, 105) * difficulty,
      r: 22,
      hp: 1,
      maxHp: 1,
      score: 10,
      exp: 9,
      type,
      color: "#9a7a58",
      dead: false,
      boss: false,
      rot: rand(0, Math.PI * 2),
      vr: rand(-2, 2),
      shape: Array.from({ length: 10 }, () => rand(0.78, 1.22))
    };

    if (type === "fast") {
      base.r = 17;
      base.vy *= 1.65;
      base.color = "#ff624d";
      base.score = 16;
      base.exp = 11;
    }

    if (type === "big") {
      base.r = 35;
      base.hp = 3;
      base.maxHp = 3;
      base.vy *= 0.82;
      base.color = "#b07945";
      base.score = 28;
      base.exp = 18;
    }

    if (type === "steel") {
      base.r = 25;
      base.hp = 5;
      base.maxHp = 5;
      base.vy *= 0.9;
      base.color = "#8f9caf";
      base.score = 34;
      base.exp = 20;
    }

    if (type === "bomb") {
      base.r = 24;
      base.hp = 2;
      base.maxHp = 2;
      base.color = "#ff9f1c";
      base.score = 32;
      base.exp = 19;
    }

    if (type === "crystal") {
      base.r = 23;
      base.hp = 1;
      base.maxHp = 1;
      base.color = "#71f2ff";
      base.score = 20;
      base.exp = 28;
    }

    if (type === "boss") {
      base.x = rand(160, W - 160);
      base.y = -90;
      base.vx = rand(-18, 18);
      base.vy = 48 + game.time * 0.12;
      base.r = 58;
      base.hp = 18 + game.level * 4;
      base.maxHp = base.hp;
      base.color = "#d9544d";
      base.score = 250;
      base.exp = 90;
      base.boss = true;
    }

    game.meteors.push(base);
  }

  function spawnFragment(x, y, vx) {
    game.meteors.push({
      x,
      y,
      vx,
      vy: rand(95, 135),
      r: 15,
      hp: 1,
      maxHp: 1,
      score: 8,
      exp: 6,
      type: "fragment",
      color: "#b7895d",
      dead: false,
      boss: false,
      rot: rand(0, Math.PI * 2),
      vr: rand(-3, 3),
      shape: Array.from({ length: 8 }, () => rand(0.8, 1.2))
    });
  }

  function impactMeteor(m) {
    m.dead = true;

    let damage = 1;
    if (m.type === "big") damage = 2;
    if (m.type === "steel") damage = 2;
    if (m.type === "bomb") damage = 3;
    if (m.boss) damage = 5;

    game.baseHp -= damage;
    game.combo = 0;

    addText(m.x, groundY - 30, "-" + damage + " HP", "#ff5555");
    addParticles(m.x, groundY, 30, "#ff5e4d", 4);

    checkGameOver();
  }

  function checkGameOver() {
    if (game.baseHp <= 0 && !game.gameOver) {
      game.baseHp = 0;
      game.gameOver = true;
      game.running = false;

      finalText.innerHTML = `
        점수: <b>${game.score}</b><br>
        생존 시간: <b>${Math.floor(game.time)}초</b><br>
        도달 레벨: <b>${game.level}</b><br>
        R 키 또는 다시하기 버튼으로 재시작
      `;

      gameOverScreen.classList.remove("hidden");
    }
  }

  function update(dt) {
    if (!game.running || game.choosing || game.gameOver) return;

    game.time += dt;

    const p = game.player;

    p.cooldowns.a = Math.max(0, p.cooldowns.a - dt);
    p.cooldowns.s = Math.max(0, p.cooldowns.s - dt);
    p.cooldowns.d = Math.max(0, p.cooldowns.d - dt);
    p.dashCooldown = Math.max(0, p.dashCooldown - dt);

    if (game.comboTimer > 0) {
      game.comboTimer -= dt;
      if (game.comboTimer <= 0) game.combo = 0;
    }

    let move = 0;
    if (keys.ArrowLeft) move -= 1;
    if (keys.ArrowRight) move += 1;
    if (move !== 0) p.facing = move;

    if (p.dashTime > 0) {
      p.x += p.facing * p.dashSpeed * dt;
      p.dashTime -= dt;
    } else {
      p.x += move * p.speed * dt;
    }

    p.x = clamp(p.x, 35, W - 35);

    game.spawnTimer -= dt;

    if (game.spawnTimer <= 0) {
      spawnMeteor(false);

      const interval = clamp(1.05 - game.time * 0.008, 0.34, 1.05);
      game.spawnTimer = rand(interval * 0.55, interval * 1.1);
    }

    game.bossTimer += dt;

    if (game.time > 30 && game.bossTimer >= 42) {
      game.bossTimer = 0;
      spawnMeteor(true);
      addText(W / 2, 110, "거대 운석 접근!", "#ff7777");
    }

    for (const m of game.meteors) {
      if (m.dead) continue;

      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.rot += m.vr * dt;

      if (m.x < m.r) {
        m.x = m.r;
        m.vx *= -0.8;
      }

      if (m.x > W - m.r) {
        m.x = W - m.r;
        m.vx *= -0.8;
      }

      if (m.y + m.r >= groundY) {
        impactMeteor(m);
      }
    }

    game.meteors = game.meteors.filter(m => !m.dead);

    for (const s of game.slashes) s.age += dt;
    game.slashes = game.slashes.filter(s => s.age < s.life);

    for (const pt of game.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 260 * dt;
      pt.life -= dt;
    }

    game.particles = game.particles.filter(pt => pt.life > 0);

    for (const t of game.texts) {
      t.y -= 36 * dt;
      t.life -= dt;
    }

    game.texts = game.texts.filter(t => t.life > 0);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawPreviews();
    drawMeteors();
    drawSlashes();
    drawParticles();
    drawPlayer();
    drawTexts();
    drawUI();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#071023");
    g.addColorStop(0.6, "#101936");
    g.addColorStop(1, "#1e2432");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = "#ffffff";

    for (let i = 0; i < 70; i++) {
      const x = (i * 137.5) % W;
      const y = (i * 61.7) % 310;
      const r = (i % 3) + 0.7;

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    ctx.fillStyle = "#20273a";
    ctx.fillRect(0, groundY, W, H - groundY);

    ctx.fillStyle = "#2e3a58";
    ctx.fillRect(0, groundY, W, 8);

    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1;

    for (let x = 0; x < W; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 8);
      ctx.lineTo(x - 35, H);
      ctx.stroke();
    }
  }

  function drawPreviews() {
    if (!game.player.preview) return;

    ctx.save();
    ctx.globalAlpha = 0.32;

    for (const m of game.meteors) {
      if (m.dead) continue;

      const t = (groundY - m.y) / Math.max(1, m.vy);
      const px = clamp(m.x + m.vx * t, m.r, W - m.r);

      ctx.fillStyle = "#ffcf40";
      ctx.beginPath();
      ctx.ellipse(px, groundY + 6, m.r * 0.75, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawMeteors() {
    for (const m of game.meteors) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.rot);

      ctx.fillStyle = m.color;
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 2;

      ctx.beginPath();

      const n = m.shape.length;

      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n;
        const rr = m.r * m.shape[i];
        const x = Math.cos(a) * rr;
        const y = Math.sin(a) * rr;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();

      if (m.maxHp > 1) {
        const barW = m.r * 1.8;
        const hpRatio = clamp(m.hp / m.maxHp, 0, 1);

        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(m.x - barW / 2, m.y - m.r - 13, barW, 5);

        ctx.fillStyle = m.boss ? "#ff5555" : "#ffdf5a";
        ctx.fillRect(m.x - barW / 2, m.y - m.r - 13, barW * hpRatio, 5);
      }
    }
  }

  function drawSlashes() {
    for (const s of game.slashes) {
      const a = 1 - s.age / s.life;

      ctx.save();
      ctx.globalAlpha = a;

      if (s.circle) {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius * (1.05 - a * 0.25), 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeStyle = s.color || "#ffffff";
        ctx.lineWidth = s.width;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();

        ctx.strokeStyle = "#ffef9a";
        ctx.lineWidth = Math.max(2, s.width * 0.16);

        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function drawPlayer() {
    const p = game.player;
    const x = p.x;
    const y = p.y;

    const swordAngle = p.facing === 1 ? -1.1 : -2.04;
    const sx = x;
    const sy = y - 58;
    const ex = sx + Math.cos(swordAngle) * 58;
    const ey = sy + Math.sin(swordAngle) * 58;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.arc(x, y - 78, 13, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 64);
    ctx.lineTo(x, y - 28);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 55);
    ctx.lineTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.strokeStyle = "#ffdf6b";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(x, y - 53);
    ctx.lineTo(x - 20 * p.facing, y - 42);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 28);
    ctx.lineTo(x - 18, y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 28);
    ctx.lineTo(x + 18, y);
    ctx.stroke();

    if (p.dashCooldown > 0) {
      const ratio = 1 - p.dashCooldown / p.dashCooldownMax;

      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(x - 24, y + 10, 48, 5);

      ctx.fillStyle = "#9bdcff";
      ctx.fillRect(x - 24, y + 10, 48 * ratio, 5);
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of game.particles) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  function drawTexts() {
    for (const t of game.texts) {
      ctx.save();
      ctx.globalAlpha = clamp(t.life, 0, 1);
      ctx.fillStyle = t.color;
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    }
  }

  function drawUI() {
    const p = game.player;

    ctx.save();

    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.fillRect(16, 14, 928, 86);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "left";

    ctx.fillText("점수 " + game.score, 32, 42);
    ctx.fillText("Lv." + game.level, 32, 72);

    ctx.fillText("방어선", 160, 42);
    drawBar(230, 25, 180, 18, game.baseHp / game.maxBaseHp, "#ff5e5e");

    ctx.fillText("경험치", 160, 72);
    drawBar(230, 55, 180, 18, game.xp / game.xpNeed, "#72e06a");

    ctx.fillText("궁극기 F", 450, 42);
    drawBar(548, 25, 150, 18, game.ult / game.ultMax, "#9bdcff");

    ctx.fillText("시간 " + Math.floor(game.time) + "초", 450, 72);

    if (game.combo > 1) {
      ctx.fillStyle = "#ffdf6b";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(game.combo + " COMBO", 928, 58);
    }

    drawSkillBox(706, 58, "A", "기본참", p.cooldowns.a, 0.24 * p.cooldownMul);
    drawSkillBox(772, 58, "S", "반월", p.cooldowns.s, 1.05 * p.skillCooldownMul);
    drawSkillBox(838, 58, "D", "승천", p.cooldowns.d, 2.2 * p.skillCooldownMul);
    drawSkillBox(904, 58, "F", "천공", game.ultMax - game.ult, game.ultMax);

    ctx.restore();
  }

  function drawSkillBox(x, y, key, name, cd, maxCd) {
    const ready = cd <= 0;

    ctx.save();

    ctx.fillStyle = ready ? "rgba(255,255,255,0.16)" : "rgba(0,0,0,0.45)";
    ctx.strokeStyle = ready ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.roundRect(x - 26, y - 26, 52, 52, 10);
    ctx.fill();
    ctx.stroke();

    if (!ready) {
      const ratio = clamp(cd / maxCd, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,0.48)";
      ctx.fillRect(x - 26, y - 26, 52, 52 * ratio);
    }

    ctx.fillStyle = ready ? "#ffdf6b" : "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(key, x, y - 2);

    ctx.font = "bold 10px sans-serif";
    ctx.fillText(name, x, y + 16);

    ctx.restore();
  }

  function drawBar(x, y, w, h, ratio, color) {
    ratio = clamp(ratio, 0, 1);

    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * ratio, h);

    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }

  function addParticles(x, y, count, color, power) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const spd = rand(45, 120) * power;

      game.particles.push({
        x,
        y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - rand(20, 90),
        size: rand(2, 5),
        color,
        life: rand(0.28, 0.72)
      });
    }
  }

  function addText(x, y, text, color) {
    game.texts.push({
      x,
      y,
      text,
      color,
      life: 0.85
    });
  }

  function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;

    if (lenSq === 0) return Math.hypot(px - x1, py - y1);

    let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = clamp(t, 0, 1);

    const cx = x1 + t * dx;
    const cy = y1 + t * dy;

    return Math.hypot(px - cx, py - cy);
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);
    draw();

    rafId = requestAnimationFrame(loop);
  }

  resetGame();
  draw();
})();
</script>
