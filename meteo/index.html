<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메테오 파이터</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #050713;
      color: white;
      font-family: system-ui, sans-serif;
    }

    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 50%, #1f2746 0%, #050713 70%);
    }

    canvas {
      width: min(100vw, 177.77vh);
      height: min(56.25vw, 100vh);
      max-width: 960px;
      max-height: 540px;
      display: block;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.68);
      z-index: 3;
    }

    .hide {
      display: none;
    }

    .box {
      width: min(520px, calc(100vw - 28px));
      padding: 25px;
      border-radius: 22px;
      background: #10162fee;
      border: 1px solid #ffffff33;
      text-align: center;
    }

    .title {
      font-size: 40px;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .sub {
      line-height: 1.65;
      opacity: 0.88;
    }

    button {
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 13px 22px;
      background: #ffd43b;
      color: #111;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
    }

    .card {
      margin-top: 10px;
      padding: 14px;
      text-align: left;
      border-radius: 16px;
      background: #202b5c;
      border: 1px solid #ffffff33;
      cursor: pointer;
    }

    .card:hover {
      border-color: #ffd43b;
    }

    .key {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #ffd43b;
      color: #111;
      font-weight: 950;
    }

    .name {
      font-size: 20px;
      font-weight: 950;
      margin-top: 6px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.84;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="960" height="540"></canvas>

    <div id="start" class="screen">
      <div class="box">
        <div class="title">메테오 파이터</div>
        <div class="sub">
          중앙의 <b>지구</b>를 지켜라.<br>
          방향키로 자유 이동, A 연타로 격투 콤보, Space 대쉬, Space+A 대쉬공격.<br>
          사방에서 몰려오는 운석을 하데스 느낌으로 파괴하는 구조다.
        </div>
        <button id="go">게임 시작</button>
      </div>
    </div>

    <div id="sel" class="screen hide">
      <div class="box">
        <div class="title" style="font-size:30px">수련 선택</div>
        <div id="cards"></div>
      </div>
    </div>

    <div id="over" class="screen hide">
      <div class="box">
        <div class="title">게임 오버</div>
        <div id="result" class="sub"></div>
        <button id="again">다시하기</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");

      const startScreen = document.getElementById("start");
      const selectScreen = document.getElementById("sel");
      const gameOverScreen = document.getElementById("over");
      const cards = document.getElementById("cards");
      const result = document.getElementById("result");
      const go = document.getElementById("go");
      const again = document.getElementById("again");

      const W = 960;
      const H = 540;
      const CENTER = { x: W / 2, y: H / 2 };
      const ARENA_R = 215;
      const EARTH_R = 46;

      let keys = {};
      let game;
      let lastTime = 0;
      let rafId = null;
      let picks = [];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function norm(x, y) {
        const d = Math.hypot(x, y) || 1;
        return { x: x / d, y: y / d };
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function newGame() {
        game = {
          run: true,
          time: 0,
          score: 0,
          level: 1,
          xp: 0,
          nextXp: 28,

          earthHp: 16,
          earthMaxHp: 16,

          combo: 0,
          comboTimer: 0,
          ult: 0,

          spawnTimer: 0,
          bossTimer: 0,
          orbTimer: rand(18, 26),

          hitStop: 0,
          shake: 0,
          flash: 0,

          limit: 0,
          cutscene: false,
          cutType: "",
          cutTimer: 0,
          overheat: 0,

          choosing: false,
          dead: false,

          meteors: [],
          hits: [],
          effects: [],
          texts: [],
          ghosts: [],
          orbs: [],

          player: {
            x: CENTER.x,
            y: CENTER.y + 115,
            vx: 0,
            vy: 0,
            face: 1,
            dir: { x: 1, y: 0 },

            pose: "idle",

            moveSpeed: 260,
            attackCooldown: 0,
            dashCooldown: 0,
            dashTimer: 0,

            lastA: 9,
            lastDash: 9,
            comboStage: 0,

            maxCombo: 1,
            damage: 1,
            range: 78,
            width: 28,
            track: 175,
            lunge: 540,
            dashSpeed: 820,

            dashReset: false,
            shock: 0,
            preview: false,
            limitExtend: false,
            attackBaseCooldown: 0.16
          }
        };
      }

      go.onclick = startGame;
      again.onclick = startGame;

      function startGame() {
        newGame();

        startScreen.classList.add("hide");
        selectScreen.classList.add("hide");
        gameOverScreen.classList.add("hide");

        cancelAnimationFrame(rafId);
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (e) => {
        keys[e.code] = true;

        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
          e.preventDefault();
        }

        if (!game) return;

        if (game.choosing) {
          if (e.code === "Digit1") pickUpgrade(0);
          if (e.code === "Digit2") pickUpgrade(1);
          if (e.code === "Digit3") pickUpgrade(2);
          return;
        }

        if (game.dead) {
          if (e.code === "KeyR") startGame();
          return;
        }

        if (game.cutscene || e.repeat) return;

        if (e.code === "Space") dash();
        if (e.code === "KeyA") attack();
        if (e.code === "KeyF") ultimate();
      });

      window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      const upgrades = [
        {
          name: "연속정권",
          desc: "A 콤보 2타 해금",
          condition: (p) => p.maxCombo < 2,
          apply: (p) => p.maxCombo = 2
        },
        {
          name: "붕권",
          desc: "A 콤보 3타 해금. 강한 전진타.",
          condition: (p) => p.maxCombo >= 2 && p.maxCombo < 3,
          apply: (p) => p.maxCombo = 3
        },
        {
          name: "올려차기",
          desc: "A 콤보 4타 해금. 넓은 각 타격.",
          condition: (p) => p.maxCombo >= 3 && p.maxCombo < 4,
          apply: (p) => p.maxCombo = 4
        },
        {
          name: "파쇄권",
          desc: "A 콤보 5타 해금. 막타 폭발.",
          condition: (p) => p.maxCombo >= 4 && p.maxCombo < 5,
          apply: (p) => p.maxCombo = 5
        },
        {
          name: "추격 보법",
          desc: "추격거리와 공격범위 증가",
          condition: () => true,
          apply: (p) => {
            p.track *= 1.18;
            p.range *= 1.12;
          }
        },
        {
          name: "무영보",
          desc: "이동속도, 공격 전진력, 대쉬속도 증가",
          condition: () => true,
          apply: (p) => {
            p.moveSpeed *= 1.12;
            p.lunge *= 1.12;
            p.dashSpeed *= 1.12;
          }
        },
        {
          name: "단전 강화",
          desc: "공격력 +1",
          condition: () => true,
          apply: (p) => p.damage += 1
        },
        {
          name: "연타 호흡",
          desc: "공격 쿨타임 감소",
          condition: () => true,
          apply: (p) => p.attackBaseCooldown *= 0.88
        },
        {
          name: "연쇄돌파",
          desc: "대쉬공격 처치 시 대쉬 초기화",
          condition: (p) => !p.dashReset,
          apply: (p) => p.dashReset = true
        },
        {
          name: "충격파",
          desc: "처치 시 주변 운석 추가 피해",
          condition: () => true,
          apply: (p) => p.shock += 1
        },
        {
          name: "지구 보강",
          desc: "지구 체력 +3",
          condition: () => true,
          apply: () => {
            game.earthMaxHp += 3;
            game.earthHp = Math.min(game.earthMaxHp, game.earthHp + 3);
          }
        },
        {
          name: "폭주 연장",
          desc: "한계돌파 중 처치하면 지속시간 증가",
          condition: (p) => !p.limitExtend,
          apply: (p) => p.limitExtend = true
        }
      ];

      function showUpgrades() {
        game.choosing = true;
        selectScreen.classList.remove("hide");

        const pool = upgrades
          .filter((up) => up.condition(game.player))
          .sort(() => Math.random() - 0.5);

        picks = pool.slice(0, 3);
        cards.innerHTML = "";

        picks.forEach((up, i) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span class="key">${i + 1}</span>
            <div class="name">${up.name}</div>
            <div class="desc">${up.desc}</div>
          `;
          card.onclick = () => pickUpgrade(i);
          cards.appendChild(card);
        });
      }

      function pickUpgrade(index) {
        if (!picks[index]) return;
        picks[index].apply(game.player);
        game.choosing = false;
        selectScreen.classList.add("hide");
      }

      function buff() {
        if (game.limit > 0) {
          return {
            speed: 0.38,
            move: 2.2,
            damage: 3,
            range: 1.8,
            track: 2,
            gold: true
          };
        }

        return {
          speed: 1,
          move: 1,
          damage: 1,
          range: 1,
          track: 1,
          gold: false
        };
      }

      function inputDir() {
        let x = 0;
        let y = 0;

        if (keys.ArrowLeft) x -= 1;
        if (keys.ArrowRight) x += 1;
        if (keys.ArrowUp) y -= 1;
        if (keys.ArrowDown) y += 1;

        if (x || y) return norm(x, y);
        return null;
      }

      function findTarget(dir, range, free) {
        const p = game.player;
        let best = null;
        let bestScore = Infinity;

        for (const m of game.meteors) {
          if (m.dead) continue;

          const dx = m.x - p.x;
          const dy = m.y - p.y;
          const d = Math.hypot(dx, dy);

          if (d > range + m.r) continue;

          let dot = 1;

          if (dir) {
            dot = (dx / (d || 1)) * dir.x + (dy / (d || 1)) * dir.y;
            if (dot < 0.2 && !free) continue;
          }

          const score = d - dot * 50 + Math.hypot(m.x - CENTER.x, m.y - CENTER.y) * -0.08;

          if (score < bestScore) {
            bestScore = score;
            best = m;
          }
        }

        return best;
      }

      function aim(range, free) {
        const p = game.player;
        const b = buff();
        const input = inputDir();

        const target = findTarget(input, range * b.track, free);

        if (target) {
          return norm(target.x - p.x, target.y - p.y);
        }

        if (input) return input;

        const autoTarget = findTarget(null, range * 1.3 * b.track, true);

        if (autoTarget) {
          return norm(autoTarget.x - p.x, autoTarget.y - p.y);
        }

        return { x: p.face, y: 0 };
      }

      function setPose(name, dir) {
        game.player.pose = name;
        if (dir) game.player.dir = dir;
      }

      function dash() {
        const p = game.player;
        const b = buff();

        if (p.dashCooldown > 0 && game.limit <= 0) return;

        const dir = inputDir() || aim(p.track * 1.3, true);

        p.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : p.face;
        p.dir = dir;

        p.vx = dir.x * p.dashSpeed * b.move;
        p.vy = dir.y * p.dashSpeed * b.move;

        p.dashCooldown = 0.72 * b.speed;
        p.dashTimer = 0.15;
        p.lastDash = 0;

        setPose("dash", dir);
        addGhost(0.22);
        addParticles(p.x, p.y, 12, b.gold ? "#ffd84a" : "#9de1ff", 2);
      }

      function attack() {
        const p = game.player;
        const b = buff();

        if (game.overheat > 0) return;
        if (p.attackCooldown > 0 && game.limit <= 0) return;

        if (p.dashTimer > 0 || p.lastDash < 0.22 || keys.Space) {
          dashAttack();
          return;
        }

        if (p.lastA > 0.62) {
          p.comboStage = 0;
        }

        p.comboStage = p.comboStage % p.maxCombo + 1;
        p.lastA = 0;

        let stage = p.comboStage;
        let name = "정권";
        let pose = "punch";
        let damage = p.damage;
        let range = p.range;
        let width = p.width;
        let move = p.lunge;
        let cooldown = p.attackBaseCooldown;
        let dir = null;

        if (stage === 2) {
          name = "연속정권";
          damage += 0.6;
          move *= 1.08;
          cooldown *= 0.88;
        }

        if (stage === 3) {
          name = "붕권";
          pose = "big";
          damage += 1.6;
          range *= 1.22;
          width *= 1.16;
          move *= 1.24;
        }

        if (stage === 4) {
          name = "올려차기";
          pose = "kick";
          damage += 1.3;
          range *= 1.34;
          width *= 1.22;

          const a = aim(p.track * 1.35, true);
          dir = norm(a.x * 0.9, a.y * 0.9 - 0.25);
        }

        if (stage === 5) {
          name = "파쇄권";
          pose = "big";
          damage += 3;
          range *= 1.45;
          width *= 1.4;
        }

        strike(name, pose, dir || aim(p.track, false), damage, range, width, move, cooldown, "combo", stage);
      }

      function dashAttack() {
        const p = game.player;
        const input = inputDir();
        let dir = aim(p.track * 1.9, true);

        let name = "대쉬정권";
        let pose = "dashPunch";
        let damage = p.damage + 1.5;
        let range = p.range * 1.6;
        let width = p.width * 1.22;
        let move = p.lunge * 1.45;

        if (input && input.y < -0.45) {
          name = "비연각";
          pose = "kick";
          dir = norm(dir.x * 0.55 + input.x * 0.22, dir.y * 0.55 + input.y * 0.65);
          range *= 1.16;
        }

        strike(name, pose, dir, damage, range, width, move, p.attackBaseCooldown * 1.04, "dash", 0);
      }

      function strike(name, pose, dir, damage, range, width, move, cooldown, source, stage) {
        const p = game.player;
        const b = buff();

        dir = norm(dir.x, dir.y);

        p.face = dir.x < -0.15 ? -1 : dir.x > 0.15 ? 1 : p.face;
        p.dir = dir;

        p.vx = dir.x * move * b.move;
        p.vy = dir.y * move * b.move;

        p.attackCooldown = cooldown * b.speed;
        setPose(pose, dir);

        addText(p.x, p.y - 54, name, b.gold ? "#ffd84a" : "#fff", 0.42);
        addGhost(0.22);

        const sx = p.x;
        const sy = p.y - 18;
        const ex = sx + dir.x * range * b.range;
        const ey = sy + dir.y * range * b.range;

        let killed = false;
        let hit = false;

        game.hits.push({
          x1: sx,
          y1: sy,
          x2: ex,
          y2: ey,
          width: width * b.range,
          timer: 0.13,
          color: b.gold ? "#ffd84a" : source === "dash" ? "#9de1ff" : "#fff"
        });

        for (const m of game.meteors) {
          if (m.dead) continue;

          const d = pointToSegmentDistance(m.x, m.y, sx, sy, ex, ey);

          if (d <= m.r + width * b.range * 0.5) {
            hit = true;

            const dead = hurtMeteor(m, Math.ceil(damage * b.damage), dir, source, stage);
            if (dead) killed = true;
          }
        }

        if (hit) {
          game.hitStop = Math.max(game.hitStop, source === "dash" ? 0.05 : 0.035);
          game.shake = Math.max(game.shake, source === "dash" ? 8 : 5);
        }

        if (killed && source === "dash" && p.dashReset) {
          p.dashCooldown = 0;
          addText(p.x, p.y - 86, "연쇄돌파!", "#9de1ff", 0.55);
        }

        if (killed && game.limit > 0 && p.limitExtend && game.limit < 8) {
          game.limit += 0.18;
        }
      }

      function hurtMeteor(m, damage, dir, source, stage) {
        m.hp -= damage;
        m.vx += dir.x * 90;
        m.vy += dir.y * 90;
        m.flash = 0.12;

        addParticles(m.x, m.y, 12 + Math.min(14, damage * 2), game.limit > 0 ? "#ffd84a" : "#fff0a8", 2.5);
        addText(m.x, m.y - m.r, "-" + damage, "#fff3a8", 0.5);

        if (game.limit > 0 || stage === 5) {
          explosion(m.x, m.y, game.limit > 0 ? 56 : 42, Math.max(1, Math.floor(damage * 0.45)));
        }

        if (m.hp <= 0) {
          killMeteor(m);
          return true;
        }

        return false;
      }

      function killMeteor(m) {
        if (m.dead) return;

        m.dead = true;
        game.score += m.score;
        game.combo += 1;
        game.comboTimer = 1.15;
        game.ult = clamp(game.ult + 7.5, 0, 100);
        game.xp += m.xp;

        if (game.xp >= game.nextXp) {
          game.xp -= game.nextXp;
          game.level += 1;
          game.nextXp = Math.floor(game.nextXp * 1.25 + 12);
          showUpgrades();
        }

        addText(m.x, m.y, "+" + m.score, "#ffef8a", 0.7);
        addParticles(m.x, m.y, 28, m.color, 3.5);

        if (m.type === "big") {
          addMeteor("fragment", m.x - 10, m.y, -70);
          addMeteor("fragment", m.x + 10, m.y, 70);
        }

        if (m.type === "bomb") {
          explosion(m.x, m.y, 72, 2);
        }

        if (game.player.shock) {
          explosion(m.x, m.y, 42 + game.player.shock * 13, game.player.shock);
        }
      }

      function explosion(x, y, radius, damage) {
        game.hits.push({
          circle: true,
          x,
          y,
          radius,
          timer: 0.18,
          color: game.limit > 0 ? "#ffd84a" : "#ffdf7e"
        });

        for (const m of game.meteors) {
          if (m.dead) continue;

          if (Math.hypot(m.x - x, m.y - y) <= radius + m.r) {
            m.hp -= damage;
            if (m.hp <= 0) killMeteor(m);
          }
        }
      }

      function spawnFromEdge() {
        const edge = Math.floor(rand(0, 4));
        let x, y;

        if (edge === 0) {
          x = rand(-40, W + 40);
          y = -40;
        } else if (edge === 1) {
          x = W + 40;
          y = rand(-40, H + 40);
        } else if (edge === 2) {
          x = rand(-40, W + 40);
          y = H + 40;
        } else {
          x = -40;
          y = rand(-40, H + 40);
        }

        return { x, y };
      }

      function addMeteor(forceType = null, fx = null, fy = null, forcedVx = null) {
        let type = forceType || "normal";

        if (!forceType) {
          const roll = Math.random();

          if (game.time > 14 && roll < 0.12) type = "fast";
          else if (game.time > 24 && roll < 0.26) type = "big";
          else if (game.time > 34 && roll < 0.38) type = "steel";
          else if (game.time > 44 && roll < 0.48) type = "bomb";
          else if (roll > 0.92) type = "crystal";
        }

        if (forceType === "boss") type = "boss";

        const spawn = (fx == null || fy == null) ? spawnFromEdge() : { x: fx, y: fy };
        const toEarth = norm(CENTER.x - spawn.x, CENTER.y - spawn.y);

        const m = {
          x: spawn.x,
          y: spawn.y,
          vx: toEarth.x * (55 + game.time * 0.7),
          vy: toEarth.y * (55 + game.time * 0.7),
          r: 18,
          hp: 1,
          maxHp: 1,
          score: 10,
          xp: 8,
          type,
          color: "#9a7755",
          dead: false,
          rot: rand(0, 7),
          vr: rand(-2, 2),
          flash: 0,
          orbit: rand(-0.5, 0.5),
          shape: Array.from({ length: 9 }, () => rand(0.78, 1.22))
        };

        if (type === "fragment") {
          m.r = 13;
          m.score = 8;
          m.xp = 5;
          m.color = "#bd8a5b";
          if (forcedVx != null) {
            m.vx += forcedVx;
          }
        }

        if (type === "fast") {
          m.r = 15;
          m.vx *= 1.5;
          m.vy *= 1.5;
          m.score = 16;
          m.xp = 10;
          m.color = "#ff644d";
        }

        if (type === "big") {
          m.r = 28;
          m.hp = 3;
          m.maxHp = 3;
          m.vx *= 0.86;
          m.vy *= 0.86;
          m.score = 30;
          m.xp = 18;
          m.color = "#b17a4c";
        }

        if (type === "steel") {
          m.r = 22;
          m.hp = 5;
          m.maxHp = 5;
          m.vx *= 0.9;
          m.vy *= 0.9;
          m.score = 36;
          m.xp = 22;
          m.color = "#92a0b0";
        }

        if (type === "bomb") {
          m.r = 21;
          m.hp = 2;
          m.maxHp = 2;
          m.score = 34;
          m.xp = 20;
          m.color = "#ff9d25";
        }

        if (type === "crystal") {
          m.r = 19;
          m.score = 20;
          m.xp = 28;
          m.color = "#75ecff";
        }

        if (type === "boss") {
          const s = spawnFromEdge();
          const t = norm(CENTER.x - s.x, CENTER.y - s.y);

          m.x = s.x;
          m.y = s.y;
          m.r = 46;
          m.hp = 18 + game.level * 4;
          m.maxHp = m.hp;
          m.score = 260;
          m.xp = 90;
          m.color = "#d9554e";
          m.vx = t.x * (40 + game.time * 0.4);
          m.vy = t.y * (40 + game.time * 0.4);
        }

        game.meteors.push(m);
      }

      function ultimate() {
        if (game.ult < 100) return;

        game.ult = 0;
        game.flash = 0.35;
        game.shake = 16;

        addText(CENTER.x, 110, "유성난무!", "#9de1ff", 1);

        for (const m of game.meteors) {
          if (m.type === "boss") {
            m.hp -= 12 + game.player.damage * 2;
            if (m.hp <= 0) killMeteor(m);
          } else {
            killMeteor(m);
          }
        }
      }

      function startLimitBreak() {
        game.cutscene = true;
        game.cutType = "start";
        game.cutTimer = 0;
        game.flash = 0.2;
        game.shake = 12;

        setPose("limit", { x: 0, y: -1 });
        addText(game.player.x, game.player.y - 94, "한계돌파!", "#ffd84a", 1.2);
      }

      function endLimitBreak() {
        game.limit = 0;
        game.cutscene = true;
        game.cutType = "end";
        game.cutTimer = 0;
        game.overheat = 0.42;
        game.shake = 8;

        setPose("over", { x: 0, y: 1 });
        addText(game.player.x, game.player.y - 88, "과부하", "#ddd", 0.75);
      }

      function update(dt) {
        if (!game.run || game.choosing || game.dead) return;

        if (game.hitStop > 0) {
          game.hitStop -= dt;
          return;
        }

        if (game.cutscene) {
          game.cutTimer += dt;

          if (game.cutType === "start" && game.cutTimer > 1.05) {
            game.cutscene = false;
            game.limit = 5;
            game.flash = 0.35;
            game.shake = 16;
            game.player.attackCooldown = 0;
            game.player.dashCooldown = 0;
            addParticles(game.player.x, game.player.y - 30, 54, "#ffd84a", 5);
          }

          if (game.cutType === "end" && game.cutTimer > 0.48) {
            game.cutscene = false;
          }

          updateVisuals(dt);
          return;
        }

        game.time += dt;

        if (game.flash > 0) game.flash -= dt;
        if (game.shake > 0) game.shake -= 30 * dt;

        const p = game.player;
        const b = buff();

        p.attackCooldown = Math.max(0, p.attackCooldown - dt);
        p.dashCooldown = Math.max(0, p.dashCooldown - dt);
        p.dashTimer = Math.max(0, p.dashTimer - dt);
        p.lastA += dt;
        p.lastDash += dt;

        if (game.overheat > 0) game.overheat -= dt;

        if (p.lastA > 0.62) p.comboStage = 0;

        if (game.comboTimer > 0) {
          game.comboTimer -= dt;
          if (game.comboTimer <= 0) game.combo = 0;
        }

        if (game.limit > 0) {
          game.limit -= dt;

          if (game.limit <= 0) {
            endLimitBreak();
            return;
          }
        }

        const moveDir = inputDir();
        const moveSpeed = p.moveSpeed * b.move;

        if (moveDir) {
          p.face = moveDir.x < -0.15 ? -1 : moveDir.x > 0.15 ? 1 : p.face;
          p.dir = moveDir;
        }

        p.x += (moveDir ? moveDir.x * moveSpeed : 0) * dt + p.vx * dt;
        p.y += (moveDir ? moveDir.y * moveSpeed : 0) * dt + p.vy * dt;

        p.vx *= Math.pow(0.05, dt);
        p.vy *= Math.pow(0.05, dt);

        const dx = p.x - CENTER.x;
        const dy = p.y - CENTER.y;
        const d = Math.hypot(dx, dy);

        if (d < EARTH_R + 16) {
          const out = norm(dx, dy);
          p.x = CENTER.x + out.x * (EARTH_R + 16);
          p.y = CENTER.y + out.y * (EARTH_R + 16);
        }

        p.x = clamp(p.x, 30, W - 30);
        p.y = clamp(p.y, 30, H - 30);

        if (Math.abs(p.vx) + Math.abs(p.vy) > 260 || game.limit > 0 || moveDir) {
          addGhost(0.14);
        }

        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          addMeteor();
          const interval = clamp(0.85 - game.time * 0.0045, 0.18, 0.85);
          game.spawnTimer = rand(interval * 0.55, interval * 1.06);
        }

        game.bossTimer += dt;
        if (game.time > 30 && game.bossTimer > 45) {
          game.bossTimer = 0;
          addMeteor("boss");
          addText(CENTER.x, 78, "거대 운석 접근!", "#ff6a6a", 1);
        }

        game.orbTimer -= dt;
        if (game.time > 15 && game.orbTimer <= 0) {
          game.orbTimer = rand(24, 34);
          game.orbs.push({
            x: rand(120, W - 120),
            y: rand(100, H - 100),
            r: 15,
            spin: 0,
            life: 8,
            dead: false
          });
          addText(CENTER.x, 92, "금빛 구슬 출현!", "#ffd84a", 1);
        }

        updateMeteors(dt);
        updateOrbs(dt);
        updateVisuals(dt);
      }

      function updateMeteors(dt) {
        for (const m of game.meteors) {
          const slow = game.limit > 0 ? 0.82 : 1;

          const toEarth = norm(CENTER.x - m.x, CENTER.y - m.y);
          m.vx += toEarth.x * 8 * dt;
          m.vy += toEarth.y * 8 * dt;

          m.x += m.vx * dt * slow;
          m.y += m.vy * dt * slow;
          m.rot += m.vr * dt;
          m.flash = Math.max(0, m.flash - dt);

          if (Math.hypot(m.x - CENTER.x, m.y - CENTER.y) <= EARTH_R + m.r) {
            m.dead = true;

            let damage = 1;
            if (m.type === "bomb") damage = 3;
            if (m.type === "big" || m.type === "steel") damage = 2;
            if (m.type === "boss") damage = 5;

            game.earthHp -= damage;
            game.combo = 0;
            game.shake = 12;

            addText(CENTER.x, CENTER.y - 58, "-" + damage + " HP", "#ff5b5b", 0.8);

            if (m.type === "bomb") {
              addParticles(CENTER.x, CENTER.y, 26, "#ff9d25", 4);
            }

            if (game.earthHp <= 0) {
              game.dead = true;
              game.run = false;

              result.innerHTML = `
                점수: <b>${game.score}</b><br>
                생존 시간: <b>${Math.floor(game.time)}초</b><br>
                도달 레벨: <b>${game.level}</b>
              `;

              gameOverScreen.classList.remove("hide");
            }
          }
        }

        game.meteors = game.meteors.filter((m) => !m.dead);
      }

      function updateOrbs(dt) {
        const p = game.player;

        for (const o of game.orbs) {
          o.spin += dt * 4;
          o.life -= dt;

          if (Math.hypot(o.x - p.x, o.y - (p.y - 18)) < o.r + 24) {
            o.dead = true;
            startLimitBreak();
          }

          if (o.life <= 0) {
            o.dead = true;
          }
        }

        game.orbs = game.orbs.filter((o) => !o.dead);
      }

      function updateVisuals(dt) {
        for (const h of game.hits) h.timer -= dt;
        game.hits = game.hits.filter((h) => h.timer > 0);

        for (const f of game.effects) {
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy += 240 * dt;
          f.timer -= dt;
        }
        game.effects = game.effects.filter((f) => f.timer > 0);

        for (const t of game.texts) {
          t.y -= 34 * dt;
          t.timer -= dt;
        }
        game.texts = game.texts.filter((t) => t.timer > 0);

        for (const gh of game.ghosts) gh.timer -= dt;
        game.ghosts = game.ghosts.filter((gh) => gh.timer > 0);
      }

      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);

        if (game && game.shake > 0) {
          ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
        }

        drawBackground();
        drawArena();
        if (game.player.preview) drawPreviews();

        for (const o of game.orbs) drawOrb(o);
        for (const m of game.meteors) drawMeteor(m);
        for (const h of game.hits) drawHit(h);

        for (const f of game.effects) {
          ctx.globalAlpha = clamp(f.timer / f.maxTimer, 0, 1);
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        for (const gh of game.ghosts) {
          drawStickman(
            gh.x,
            gh.y,
            gh.pose,
            gh.dir,
            clamp(gh.timer / gh.maxTimer, 0, 1) * 0.28,
            gh.gold ? "#ffd84a" : "#9de1ff"
          );
        }

        drawStickman(
          game.player.x,
          game.player.y,
          game.player.pose,
          game.player.dir,
          1,
          game.limit > 0 ? "#ffd84a" : "#fff"
        );

        for (const t of game.texts) {
          ctx.globalAlpha = clamp(t.timer / t.maxTimer, 0, 1);
          ctx.fillStyle = t.color;
          ctx.font = "900 22px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(t.text, t.x, t.y);
          ctx.globalAlpha = 1;
        }

        drawUI();
        drawModeEffects();

        ctx.restore();
      }

      function drawBackground() {
        const gr = ctx.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, "#060817");
        gr.addColorStop(0.58, "#101936");
        gr.addColorStop(1, "#1a1f34");

        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = 0.4;
        ctx.fillStyle = "#fff";

        for (let i = 0; i < 90; i++) {
          ctx.beginPath();
          ctx.arc((i * 97.3) % W, (i * 53.1) % H, (i % 3) * 0.55 + 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
      }

      function drawArena() {
        ctx.save();

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, ARENA_R, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, ARENA_R * 0.65, 0, Math.PI * 2);
        ctx.stroke();

        const earthGrad = ctx.createRadialGradient(CENTER.x, CENTER.y, 8, CENTER.x, CENTER.y, EARTH_R);
        earthGrad.addColorStop(0, "#6de4ff");
        earthGrad.addColorStop(0.6, "#2a7df7");
        earthGrad.addColorStop(1, "#0f2f73");

        ctx.fillStyle = earthGrad;
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, EARTH_R, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#ffffff18";
        ctx.beginPath();
        ctx.arc(CENTER.x - 12, CENTER.y - 14, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPreviews() {
        for (const m of game.meteors) {
          const toEarth = norm(CENTER.x - m.x, CENTER.y - m.y);
          const futureX = m.x + (m.vx + toEarth.x * 8) * 1.2;
          const futureY = m.y + (m.vy + toEarth.y * 8) * 1.2;

          ctx.globalAlpha = 0.3;
          ctx.fillStyle = "#ffd84a";
          ctx.beginPath();
          ctx.arc(futureX, futureY, Math.max(5, m.r * 0.22), 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function drawOrb(o) {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.spin);

        const gr = ctx.createRadialGradient(0, 0, 3, 0, 0, 32);
        gr.addColorStop(0, "#fff");
        gr.addColorStop(0.32, "#fff08a");
        gr.addColorStop(1, "rgba(255,216,74,0)");

        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff4a8";
        ctx.beginPath();
        ctx.arc(0, 0, o.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawMeteor(m) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rot);

        ctx.fillStyle = m.flash > 0 ? "#fff" : m.color;
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;

        ctx.beginPath();
        m.shape.forEach((q, i) => {
          const a = Math.PI * 2 * i / m.shape.length;
          const x = Math.cos(a) * m.r * q;
          const y = Math.sin(a) * m.r * q;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        if (m.maxHp > 1) {
          const w = m.r * 1.8;
          const ratio = clamp(m.hp / m.maxHp, 0, 1);

          ctx.fillStyle = "#0008";
          ctx.fillRect(m.x - w / 2, m.y - m.r - 13, w, 5);

          ctx.fillStyle = m.type === "boss" ? "#ff5555" : "#ffd84a";
          ctx.fillRect(m.x - w / 2, m.y - m.r - 13, w * ratio, 5);
        }
      }

      function drawHit(h) {
        ctx.save();
        ctx.globalAlpha = clamp(h.timer / 0.13, 0, 1);

        if (h.circle) {
          ctx.strokeStyle = h.color;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.lineCap = "round";

          ctx.strokeStyle = h.color;
          ctx.lineWidth = h.width;
          ctx.beginPath();
          ctx.moveTo(h.x1, h.y1);
          ctx.lineTo(h.x2, h.y2);
          ctx.stroke();

          ctx.strokeStyle = "#fff";
          ctx.lineWidth = Math.max(2, h.width * 0.16);
          ctx.beginPath();
          ctx.moveTo(h.x1, h.y1);
          ctx.lineTo(h.x2, h.y2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawStickman(px, py, pose, dir, alpha, color) {
        dir = norm(dir.x || 0, dir.y || 0);
        if (!isFinite(dir.x)) dir = { x: 1, y: 0 };

        const side = Math.abs(dir.x) > 0.15 ? Math.sign(dir.x) : game.player.face;
        const perp = { x: -dir.y, y: dir.x };

        let neck = { x: px, y: py - 28 };
        let hip = { x: px, y: py + 6 };
        let head = { x: px, y: py - 43 };

        let armA = { x: neck.x + side * 20, y: neck.y + 8 };
        let armB = { x: neck.x - side * 18, y: neck.y + 13 };
        let legA = { x: hip.x + side * 16, y: hip.y + 28 };
        let legB = { x: hip.x - side * 16, y: hip.y + 28 };

        if (pose === "punch") {
          neck.x += dir.x * 8;
          neck.y += dir.y * 4;
          armA = { x: neck.x + dir.x * 48, y: neck.y + dir.y * 48 };
          armB = {
            x: neck.x - dir.x * 18 - perp.x * 12,
            y: neck.y - dir.y * 18 - perp.y * 12
          };
        }

        if (pose === "big" || pose === "dashPunch") {
          neck.x += dir.x * 15;
          neck.y += dir.y * 8;

          armA = { x: neck.x + dir.x * 60, y: neck.y + dir.y * 60 };
          armB = {
            x: neck.x - dir.x * 24 - perp.x * 12,
            y: neck.y - dir.y * 24 - perp.y * 12
          };

          legA = {
            x: hip.x - dir.x * 26 + perp.x * 14,
            y: hip.y - dir.y * 26 + perp.y * 14 + 22
          };

          legB = {
            x: hip.x - dir.x * 18 - perp.x * 14,
            y: hip.y - dir.y * 18 - perp.y * 14 + 24
          };
        }

        if (pose === "kick") {
          const up = norm(dir.x * 0.8, dir.y - 0.5);
          armA = { x: neck.x + up.x * 18 + side * 8, y: neck.y + up.y * 18 };
          legA = { x: hip.x + up.x * 16, y: hip.y + up.y * 52 };
          legB = { x: hip.x - side * 18, y: hip.y + 24 };
        }

        if (pose === "dash") {
          neck.x += dir.x * 16;
          neck.y += dir.y * 10;

          armA = {
            x: neck.x - dir.x * 24 + perp.x * 8,
            y: neck.y - dir.y * 24 + perp.y * 8
          };

          armB = {
            x: neck.x - dir.x * 28 - perp.x * 8,
            y: neck.y - dir.y * 28 - perp.y * 8
          };
        }

        if (pose === "limit") {
          neck.y += 9;
          hip.y += 10;
          head.y += 8;

          armA = { x: neck.x + 24, y: neck.y + 32 };
          armB = { x: neck.x - 24, y: neck.y + 32 };
          legA = { x: hip.x + 25, y: hip.y + 28 };
          legB = { x: hip.x - 25, y: hip.y + 28 };

          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(px, py - 12, 60, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (pose === "over") {
          neck.y += 12;
          hip.y += 10;
          head.y += 12;
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        line(neck, hip);
        line(neck, armA);
        line(neck, armB);
        line(hip, legA);
        line(hip, legB);

        ctx.beginPath();
        ctx.arc(head.x, head.y, 12, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function line(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawUI() {
        ctx.fillStyle = "#0006";
        ctx.fillRect(12, 12, W - 24, 80);

        ctx.fillStyle = "#fff";
        ctx.font = "900 18px system-ui";
        ctx.textAlign = "left";

        ctx.fillText("점수 " + game.score, 24, 38);
        ctx.fillText("Lv." + game.level, 24, 64);

        ctx.fillText("지구", 128, 38);
        drawBar(176, 24, 150, 16, game.earthHp / game.earthMaxHp, "#5ec7ff");

        ctx.fillText("경험치", 128, 64);
        drawBar(176, 50, 150, 16, game.xp / game.nextXp, "#69e36d");

        ctx.fillText("F", 360, 38);
        drawBar(386, 24, 110, 16, game.ult / 100, "#9de1ff");

        ctx.fillStyle = "#d7e3ff";
        ctx.font = "800 13px system-ui";
        ctx.fillText("방향키 이동 · A 콤보 · Space 대쉬 · Space+A", 24, 86);

        if (game.combo > 1) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 28px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.combo + " COMBO", W / 2, 122);
        }

        if (game.limit > 0) {
          ctx.fillStyle = "#ffd84a";
          ctx.font = "950 18px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("한계돌파", W / 2, 152);
          drawBar(W / 2 - 128, 160, 256, 12, game.limit / 5, "#ffd84a");
        }
      }

      function drawBar(x, y, w, h, ratio, color) {
        ratio = clamp(ratio, 0, 1);

        ctx.fillStyle = "#ffffff26";
        ctx.fillRect(x, y, w, h);

        ctx.fillStyle = color;
        ctx.fillRect(x, y, w * ratio, h);

        ctx.strokeStyle = "#ffffff55";
        ctx.strokeRect(x, y, w, h);
      }

      function drawModeEffects() {
        if (game.flash > 0) {
          ctx.globalAlpha = clamp(game.flash * 2.2, 0, 0.6);
          ctx.fillStyle = game.limit > 0 || game.cutType === "start" ? "#ffd84a" : "#fff";
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }

        if (game.limit > 0) {
          ctx.globalAlpha = game.limit < 1 ? Math.sin(game.time * 40) * 0.2 + 0.55 : 0.35;
          ctx.strokeStyle = "#ffd84a";
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, W - 10, H - 10);
          ctx.globalAlpha = 1;
        }

        if (game.cutscene) {
          ctx.fillStyle = "#0005";
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = game.cutType === "start" ? "#ffd84a" : "#ddd";
          ctx.font = "950 42px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(game.cutType === "start" ? "한계돌파" : "과부하", W / 2, 220);
        }
      }

      function addParticles(x, y, count, color, power) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const s = rand(45, 120) * power;

          game.effects.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - rand(20, 90),
            size: rand(2, 4.8),
            color,
            timer: rand(0.28, 0.72),
            maxTimer: 0.72
          });
        }
      }

      function addText(x, y, text, color, timer = 0.85) {
        game.texts.push({
          x,
          y,
          text,
          color,
          timer,
          maxTimer: timer
        });
      }

      function addGhost(timer) {
        const p = game.player;

        if (game.ghosts[0] && Math.hypot(game.ghosts[0].x - p.x, game.ghosts[0].y - p.y) < 6) {
          return;
        }

        game.ghosts.unshift({
          x: p.x,
          y: p.y,
          pose: p.pose,
          dir: { ...p.dir },
          timer,
          maxTimer: timer,
          gold: game.limit > 0
        });
      }

      function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;

        if (!lenSq) return Math.hypot(px - x1, py - y1);

        const t = clamp(((px - x1) * dx + (py - y1) * dy) / lenSq, 0, 1);

        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);
        draw();

        rafId = requestAnimationFrame(loop);
      }

      newGame();
      draw();
    })();
  </script>
</body>
</html>
